name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoriyi Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sabit Dijital İmza (Keystore) Yükle
        run: |
          mkdir -p ~/.android
          cat << 'EOF' | base64 -d > ~/.android/debug.keystore
          MIIJpQIBAzCCCS8GCSqGSIb3DQEHAaCCCRAEggkMMIIJCDCCAt8GCSqGSIb3DQEHAaCCAvAEggLs
          MIIC6DCCAuQCAQAwggLdBgkqhkiG9w0BBwagggLUMIIC0AIBADCCAscGCSqGSIb3DQEHATAeBglg
          hkgBZQMEAS4wEQQMk1eC2xPBR0wCAQIACgSNCAEeggKsc4mG9U9bL43w8qEwJ83V3iFw206qF30y
          9eW0B0c92XmX3U2vS0L2f4Q4f4m4O2I4p7o7r5y5s4e3w2v1u0t9s8r7q6p5o4n3m2l1k0j9i8h7
          g6f5e4d3c2b1a0Z9Y8X7W6V5U4T3S2R1Q0P9O8N7M6L5K4J3I2H1G0F9E8D7C6B5A4M3L2K1J0I9
          H8G7F6E5D4C3B2A1M0L9K8J7I6H5G4F3E2D1C0B9A8M7L6K5J4I3H2G1F0E9D8C7B6A5M4L3K2J1
          I0H9G8F7E6D5C4B3A2M1L0K9J8I7H6G5F4E3D2C1B0A9M8L7K5J4I3H2G1F0E9D8C7B6A5M4L3K2
          J1I0H9G8F7E6D5C4B3A2M1L0K9J8I7H6G5F4E3D2C1B0A9M8L7K5J4I3H2G1F0E9D8C7B6A5M4L3
          K2J1I0H9G8F7E6D5C4B3A2M1L0K9J8I7H6G5F4E3D2C1B0A9M8L7K5J4I3H2G1F0E9D8C7B6A5M4
          EOF
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12
          fi

      - name: SHA-1 Parmak İzinizi Ekrana Yazdır
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:" || true

      - name: Bağımlılıkları Yükle
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install --legacy-peer-deps @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor-community/contacts@5.0.5 @codetrix-studio/capacitor-google-auth@3.3.0

      - name: Web Dosyalarını Hazırla ve Konfigüre Et
        run: |
          rm -rf www
          mkdir -p www
          cp -r *.html *.js *.json *.css www/ 2>/dev/null || true
          cp -r js static assets css www/ 2>/dev/null || true
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.aurachat.app",
            "appName": "AuraChat",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://aurachat-amber.vercel.app",
              "cleartext": true
            },
            "plugins": {
              "GoogleAuth": {
                "scopes": ["profile", "email"],
                "serverClientId": "447747395966-3shresouu36769er1b9656oec8vd13aa.apps.googleusercontent.com",
                "forceCodeForRefreshToken": true
              }
            }
          }
          EOF

      - name: Capacitor Android Ekle ve Senkronize Et
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Android İzinlerini ve String Yapılandırmasını Düzenle
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          STRINGS_PATH="android/app/src/main/res/values/strings.xml"

          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "READ_CONTACTS" "$MANIFEST_PATH"; then
              sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_CONTACTS" \/>' "$MANIFEST_PATH"
            fi
          fi

          if [ -f "$STRINGS_PATH" ]; then
            if ! grep -q "server_client_id" "$STRINGS_PATH"; then
              sed -i '/<\/resources>/i \    <string name="server_client_id">447747395966-3shresouu36769er1b9656oec8vd13aa.apps.googleusercontent.com<\/string>' "$STRINGS_PATH"
            fi
          fi

      - name: APK Derle (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını Çıktı Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: AuraChat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
