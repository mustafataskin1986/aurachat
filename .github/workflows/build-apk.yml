          def set_items(name, items):
              """Stilin içindeki öğeleri (varsa değiştirir, yoksa ekler). Stil yoksa oluşturur."""
              global s
              m = re.search(r'(<style name="%s"[^>]*>)(.*?)(</style>)' % re.escape(name), s, re.S)
              if not m:
