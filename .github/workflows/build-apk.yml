            cat > "$DIR/AuraScreenService.java" << 'EOF'
          package com.aurachat.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.MediaCodec;
          import android.media.MediaCodecInfo;
          import android.media.MediaFormat;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.util.Base64;
          import android.util.DisplayMetrics;
          import android.view.Surface;
          import android.view.WindowManager;
          import java.io.ByteArrayOutputStream;
          import java.nio.ByteBuffer;

          // Ekran yakalama için zorunlu ön plan hizmeti (bildirimde "ekran paylaşılıyor" görünür)
          public class AuraScreenService extends Service {
              private static final String CHANNEL = "aura_screen_share";
              private static final int NOTIF_ID = 7711;
              private static final int MAX_SIDE = 1280;     // en uzun kenar (px)
              private static final long MIN_GAP_MS = 140;   // kareler arası en az süre (~7 kare/sn)

              private MediaProjection projection = null;
              private VirtualDisplay display = null;
              private ImageReader reader = null;
              private HandlerThread thread = null;
              private Handler handler = null;
              private long lastFrame = 0;
              private boolean stopped = false;
              private MediaCodec encoder = null;
              private Surface inputSurface = null;
              private android.media.AudioRecord audioRec = null;
              private volatile boolean audioRun = false;
              private Thread audioThread = null;
              private static volatile AuraScreenService instance = null;

              static void requestKeyFrameStatic() {
                  AuraScreenService s = instance;
                  if (s != null) s.requestKeyFrame();
              }

              void requestKeyFrame() {
                  try {
                      MediaCodec c = encoder;
                      if (c == null) return;
                      Bundle b = new Bundle();
                      b.putInt(MediaCodec.PARAMETER_KEY_REQUEST_SYNC_FRAME, 0);
                      c.setParameters(b);
                  } catch (Throwable t) {}
              }

              // Telefonun iç sesi (medya/oyun sesi; Android 10+, mikrofon izni gerekir). 48 kHz mono alınır, 24 kHz'e indirilip gönderilir.
              // Sessiz anlar gönderilmez.
              private void startAudio() {
                  if (Build.VERSION.SDK_INT < 29 || projection == null) return;
                  try {
                      if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) != android.content.pm.PackageManager.PERMISSION_GRANTED) return;
                      android.media.AudioPlaybackCaptureConfiguration cfg = new android.media.AudioPlaybackCaptureConfiguration.Builder(projection)
                          .addMatchingUsage(android.media.AudioAttributes.USAGE_MEDIA)
                          .addMatchingUsage(android.media.AudioAttributes.USAGE_GAME)
                          .addMatchingUsage(android.media.AudioAttributes.USAGE_UNKNOWN)
                          .build();
                      android.media.AudioFormat af = new android.media.AudioFormat.Builder()
                          .setEncoding(android.media.AudioFormat.ENCODING_PCM_16BIT)
                          .setSampleRate(48000)
                          .setChannelMask(android.media.AudioFormat.CHANNEL_IN_MONO)
                          .build();
                      int minBuf = android.media.AudioRecord.getMinBufferSize(48000, android.media.AudioFormat.CHANNEL_IN_MONO, android.media.AudioFormat.ENCODING_PCM_16BIT);
                      int bufSize = Math.max(minBuf, 48000 * 2 / 4);
                      android.media.AudioRecord rec = new android.media.AudioRecord.Builder()
                          .setAudioPlaybackCaptureConfig(cfg)
                          .setAudioFormat(af)
                          .setBufferSizeInBytes(bufSize)
                          .build();
                      if (rec.getState() != android.media.AudioRecord.STATE_INITIALIZED) { try { rec.release(); } catch (Throwable t) {} return; }
                      rec.startRecording();
                      audioRec = rec;
                      audioRun = true;
                      final android.media.AudioRecord r = rec;
                      audioThread = new Thread(new Runnable() {
                          @Override
                          public void run() {
                              short[] in = new short[2880];      // 60 ms @ 48 kHz
                              byte[] out = new byte[1440 * 2];   // 60 ms @ 24 kHz
                              while (audioRun) {
                                  int got = 0;
                                  while (audioRun && got < in.length) {
                                      int n = r.read(in, got, in.length - got);
                                      if (n <= 0) { audioRun = false; break; }
                                      got += n;
                                  }
                                  if (!audioRun || got < in.length) break;
                                  int peak = 0;
                                  for (int i = 0; i < 1440; i++) {
                                      int v = (in[2 * i] + in[2 * i + 1]) / 2;
                                      int a = v < 0 ? -v : v;
                                      if (a > peak) peak = a;
                                      out[2 * i] = (byte) (v & 0xff);
                                      out[2 * i + 1] = (byte) ((v >> 8) & 0xff);
                                  }
                                  if (peak < 8) continue; // sessizlik: gönderme
                                  AuraScreen.sendAudio(Base64.encodeToString(out, Base64.NO_WRAP));
                              }
                          }
                      }, "AuraScreenAudio");
                      audioThread.setDaemon(true);
                      audioThread.start();
                  } catch (Throwable t) {
                      audioRun = false;
                      try { if (audioRec != null) audioRec.release(); } catch (Throwable t2) {}
                      audioRec = null;
                  }
              }

              // H.264 kodlayıcı: ekran doğrudan donanımla videoya çevrilir. Önce ayrıntılı ayarlarla, olmazsa sade ayarlarla dener.
              private MediaCodec buildEncoder(int w, int h, boolean extras) throws Exception {
                  MediaFormat fmt = MediaFormat.createVideoFormat("video/avc", w, h);
                  fmt.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface);
                  int bitrate = (int) Math.max(1500000L, Math.min(4000000L, (long) (w * (long) h * 30L / 10L)));
                  fmt.setInteger(MediaFormat.KEY_BIT_RATE, bitrate);
                  fmt.setInteger(MediaFormat.KEY_FRAME_RATE, 30);
                  fmt.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 2);
                  if (extras) {
                      try { fmt.setInteger(MediaFormat.KEY_BITRATE_MODE, MediaCodecInfo.EncoderCapabilities.BITRATE_MODE_VBR); } catch (Throwable t) {}
                      try { fmt.setInteger(MediaFormat.KEY_PROFILE, MediaCodecInfo.CodecProfileLevel.AVCProfileBaseline); } catch (Throwable t) {}
                      try { fmt.setLong(MediaFormat.KEY_REPEAT_PREVIOUS_FRAME_AFTER, 400000L); } catch (Throwable t) {}
                      try { fmt.setInteger("prepend-sps-pps-to-idr-frames", 1); } catch (Throwable t) {}
                      try { if (Build.VERSION.SDK_INT >= 23) fmt.setInteger(MediaFormat.KEY_PRIORITY, 0); } catch (Throwable t) {}
                      try { if (Build.VERSION.SDK_INT >= 30) fmt.setInteger(MediaFormat.KEY_LATENCY, 1); } catch (Throwable t) {}
                  }
                  final int fw = w, fh = h;
                  MediaCodec c = MediaCodec.createEncoderByType("video/avc");
                  try {
                      c.setCallback(new MediaCodec.Callback() {
                          @Override
                          public void onInputBufferAvailable(MediaCodec codec, int index) {}

                          @Override
                          public void onOutputBufferAvailable(MediaCodec codec, int index, MediaCodec.BufferInfo info) {
                              try {
                                  java.nio.ByteBuffer ob = codec.getOutputBuffer(index);
                                  if (ob != null && info.size > 0) {
                                      byte[] data = new byte[info.size];
                                      ob.position(info.offset);
                                      ob.limit(info.offset + info.size);
                                      ob.get(data);
                                      String b64 = Base64.encodeToString(data, Base64.NO_WRAP);
                                      if ((info.flags & MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0) {
                                          AuraScreen.sendH264Config(b64, fw, fh);
                                      } else {
                                          boolean key = (info.flags & MediaCodec.BUFFER_FLAG_KEY_FRAME) != 0;
                                          AuraScreen.sendH264(b64, key, info.presentationTimeUs / 1000L);
                                      }
                                  }
                              } catch (Throwable t) {
                              } finally {
                                  try { codec.releaseOutputBuffer(index, false); } catch (Throwable t) {}
                              }
                          }

                          @Override
                          public void onOutputFormatChanged(MediaCodec codec, MediaFormat format) {}

                          @Override
                          public void onError(MediaCodec codec, MediaCodec.CodecException e) { shutdown(true); }
                      }, handler);
                      c.configure(fmt, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE);
                  } catch (Exception e) {
                      try { c.release(); } catch (Throwable t) {}
                      throw e;
                  }
                  return c;
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP".equals(intent.getAction())) {
                      shutdown(true);
                      return START_NOT_STICKY;
                  }
                  try {
                      instance = this;
                      startAsForeground();
                      boolean h264 = intent.getBooleanExtra("h264", false);
                      int code = intent.getIntExtra("code", 0);
                      Intent data = (Intent) intent.getParcelableExtra("data");
                      if (data == null) { shutdown(true); return START_NOT_STICKY; }
                      MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      projection = mpm.getMediaProjection(code, data);
                      if (projection == null) { shutdown(true); return START_NOT_STICKY; }

                      thread = new HandlerThread("AuraScreenCapture");
                      thread.start();
                      handler = new Handler(thread.getLooper());

                      // Android 14: önce geri çağrı kaydedilmeli
                      projection.registerCallback(new MediaProjection.Callback() {
                          @Override
                          public void onStop() { shutdown(true); }
                      }, handler);

                      DisplayMetrics dm = new DisplayMetrics();
                      WindowManager wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                      wm.getDefaultDisplay().getRealMetrics(dm);
                      float scale = Math.min(1f, (float) MAX_SIDE / (float) Math.max(dm.widthPixels, dm.heightPixels));
                      final int w = Math.max(2, (Math.round(dm.widthPixels * scale) / 2) * 2);
                      final int h = Math.max(2, (Math.round(dm.heightPixels * scale) / 2) * 2);

                      if (h264) {
                          try {
                              try { encoder = buildEncoder(w, h, true); }
                              catch (Exception e1) { encoder = buildEncoder(w, h, false); }
                              inputSurface = encoder.createInputSurface();
                              encoder.start();
                              display = projection.createVirtualDisplay("AuraChatScreen", w, h, dm.densityDpi,
                                  DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, inputSurface, null, handler);
                              AuraScreen.js("window.__auraScreenSize&&window.__auraScreenSize(" + w + "," + h + ")");
                              AuraScreen.notifyStarted();
                              startAudio();
                          } catch (Throwable t) {
                              shutdown(true);
                          }
                          return START_NOT_STICKY;
                      }

                      reader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2);
                      reader.setOnImageAvailableListener(new ImageReader.OnImageAvailableListener() {
                          @Override
                          public void onImageAvailable(ImageReader r) {
                              Image img = null;
                              try {
                                  img = r.acquireLatestImage();
                                  if (img == null) return;
                                  long now = android.os.SystemClock.uptimeMillis();
                                  if (AuraScreen.busy || now - lastFrame < MIN_GAP_MS) return;
                                  lastFrame = now;
                                  Image.Plane plane = img.getPlanes()[0];
                                  ByteBuffer buf = plane.getBuffer();
                                  int pixelStride = plane.getPixelStride();
                                  int rowStride = plane.getRowStride();
                                  int rowPadding = rowStride - pixelStride * w;
                                  Bitmap full = Bitmap.createBitmap(w + rowPadding / pixelStride, h, Bitmap.Config.ARGB_8888);
                                  full.copyPixelsFromBuffer(buf);
                                  Bitmap bmp = Bitmap.createBitmap(full, 0, 0, w, h);
                                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                                  bmp.compress(Bitmap.CompressFormat.JPEG, 60, out);
                                  full.recycle();
                                  if (bmp != full) bmp.recycle();
                                  AuraScreen.sendFrame(Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP));
                              } catch (Throwable t) {
                              } finally {
                                  try { if (img != null) img.close(); } catch (Throwable t) {}
                              }
                          }
                      }, handler);

                      display = projection.createVirtualDisplay("AuraChatScreen", w, h, dm.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.getSurface(), null, handler);
                      AuraScreen.notifyStarted();
                  } catch (Throwable t) {
                      shutdown(true);
                  }
                  return START_NOT_STICKY;
              }

              private void startAsForeground() {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26 && nm != null) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "Ekran paylaşımı", NotificationManager.IMPORTANCE_LOW);
                      nm.createNotificationChannel(ch);
                  }
                  int flagsImm = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                  Intent stop = new Intent(this, AuraScreenService.class);
                  stop.setAction("STOP");
                  PendingIntent stopPi = PendingIntent.getService(this, 1, stop, PendingIntent.FLAG_UPDATE_CURRENT | flagsImm);
                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent openPi = PendingIntent.getActivity(this, 2, open, PendingIntent.FLAG_UPDATE_CURRENT | flagsImm);

                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CHANNEL) : new Notification.Builder(this);
                  b.setContentTitle("AuraChat ekranını paylaşıyor")
                   .setContentText("Durdurmak için dokun")
                   .setSmallIcon(getApplicationInfo().icon)
                   .setOngoing(true)
                   .setContentIntent(stopPi)
                   .addAction(0, "Durdur", stopPi);
                  Notification n = b.build();
                  if (Build.VERSION.SDK_INT >= 29) startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  else startForeground(NOTIF_ID, n);
              }

              private synchronized void shutdown(boolean tellJs) {
                  if (stopped) return;
                  stopped = true;
                  try { if (display != null) display.release(); } catch (Throwable t) {}
                  try { if (reader != null) reader.close(); } catch (Throwable t) {}
                  audioRun = false;
                  try { if (audioRec != null) { audioRec.stop(); } } catch (Throwable t) {}
                  try { if (audioRec != null) { audioRec.release(); } } catch (Throwable t) {}
                  audioRec = null;
                  try { if (encoder != null) { encoder.stop(); } } catch (Throwable t) {}
                  try { if (encoder != null) { encoder.release(); } } catch (Throwable t) {}
                  try { if (inputSurface != null) inputSurface.release(); } catch (Throwable t) {}
                  encoder = null; inputSurface = null; instance = null;
                  try { if (projection != null) projection.stop(); } catch (Throwable t) {}
                  try { if (thread != null) thread.quitSafely(); } catch (Throwable t) {}
                  display = null; reader = null; projection = null;
                  if (tellJs) AuraScreen.notifyStopped();
                  try { stopForeground(true); } catch (Throwable t) {}
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  shutdown(true);
                  super.onDestroy();
              }
          }
          EOF
            echo "AuraScreen dosyaları yazıldı."
          else
            echo "UYARI: MainActivity.java bulunamadı, AuraScreen yazılamadı!"
          fi

      - name: Uygulama İkonunu PWA İkonlarından Üret
        run: |
          pip install pillow --quiet
          python3 - << 'PY'
          import os, glob
          from PIL import Image, ImageDraw

          RES = "android/app/src/main/res"
          ICON = "static/icons/icon-512.png"
          MASK = "static/icons/icon-maskable-512.png"

          if not (os.path.exists(ICON) and os.path.exists(MASK)):
              print("UYARI: static/icons icinde ikonlar bulunamadi, Capacitor ikonu kaliyor")
              raise SystemExit(0)

          icon = Image.open(ICON).convert("RGBA")
          mask = Image.open(MASK).convert("RGBA")

          # Adaptive ikonun arka plan rengi: maskable ikonun köşe pikseli
          bg = mask.getpixel((4, 4))
          if bg[3] < 255:
              bg_hex = "#00000000"   # köşe şeffafsa arka plan da şeffaf kalsın (siyaha boyama)
          else:
              bg_hex = "#%02x%02x%02x" % (bg[0], bg[1], bg[2])

          legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          fg = {"mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}

          def round_icon(img, size):
              im = img.resize((size, size), Image.LANCZOS)
              m = Image.new("L", (size * 4, size * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, size * 4 - 1, size * 4 - 1), fill=255)
              m = m.resize((size, size), Image.LANCZOS)
              out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              out.paste(im, (0, 0), m)
              return out

          # Şablondaki eski webp ikonlar PNG ile çakışmasın
          for f in glob.glob(RES + "/mipmap-*/ic_launcher*.webp"):
              os.remove(f)

          for dens, size in legacy.items():
              p = "%s/mipmap-%s" % (RES, dens)
              os.makedirs(p, exist_ok=True)
              icon.resize((size, size), Image.LANCZOS).save(p + "/ic_launcher.png")
              icon.resize((size, size), Image.LANCZOS).save(p + "/ic_launcher_round.png")

          # ESKİ (legacy) SİSTEM: adaptive ikon yok, resim kenardan kenara olduğu gibi görünür
          for f in glob.glob(RES + "/mipmap-anydpi*/ic_launcher*.xml"):
              os.remove(f)
          for f in glob.glob(RES + "/mipmap-*/aura_icon_fg.png"):
              os.remove(f)
          print("Ikonlar static/icons'tan uretildi, arka plan:", bg_hex)
          PY

