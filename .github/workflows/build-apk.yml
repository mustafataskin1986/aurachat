          // Sohbet başına TEK bildirim bloğu (WhatsApp gibi), "Cevapla" ve "Okundu olarak işaretle" düğmeleri.
          public class AuraNotif {
              static final String CHANNEL = "aurachat-messages";
              static final String PREFS = "aura_notif";
              static final String ACT_REPLY = "com.aurachat.app.NOTIF_REPLY";
              static final String ACT_READ = "com.aurachat.app.NOTIF_READ";
              static final String ACT_MUTE = "com.aurachat.app.NOTIF_MUTE";
              static final String ACT_CLEAR = "com.aurachat.app.NOTIF_CLEAR";
              static final String KEY_REPLY = "aura_reply";
              static final String API = "https://aurachat-amber.vercel.app/api/notify-action";
              static final String DELETED = "🚫 Bu mesaj silindi";
              static final int ACCENT = 0xFF9333EA;
              static final int MAX_MSGS = 15;

              private static SharedPreferences sp(Context c) {
                  return c.getApplicationContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              // ---------- oturum (Cevapla / Okundu için) ----------
              static void setSession(Context c, String uid, String refreshToken) {
                  sp(c).edit().putString("uid", uid == null ? "" : uid).putString("rt", refreshToken == null ? "" : refreshToken).apply();
              }

              static void clearSession(Context c) {
                  sp(c).edit().remove("uid").remove("rt").apply();
              }

              // ---------- sohbet deposu ----------
              static synchronized JSONArray stored(Context c, String chatId) {
                  try {
                      String s = sp(c).getString("chat_" + chatId, null);
                      return s == null ? new JSONArray() : new JSONArray(s);
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              private static synchronized void save(Context c, String chatId, JSONArray arr) {
                  JSONArray out = new JSONArray();
                  int start = Math.max(0, arr.length() - MAX_MSGS);
                  for (int i = start; i < arr.length(); i++) out.put(arr.opt(i));
                  sp(c).edit().putString("chat_" + chatId, out.toString()).putLong("dbg_save", System.currentTimeMillis()).apply();
              }

              private static synchronized JSONObject meta(Context c, String chatId) {
                  try {
                      String s = sp(c).getString("meta_" + chatId, null);
                      return s == null ? new JSONObject() : new JSONObject(s);
                  } catch (Exception e) {
                      return new JSONObject();
                  }
              }

              // Bildirim kapanırken (dokunma dahil) silinmeden önce kısa süreliğine yedeklenir; bildirimle açılışta okunur
              static synchronized void stashAndForget(Context c, String chatId) {
                  try {
                      JSONArray arr = stored(c, chatId);
                      if (arr.length() > 0) {
                          sp(c).edit().putString("gone_" + chatId, arr.toString()).putLong("gone_t_" + chatId, System.currentTimeMillis()).apply();
                      }
                  } catch (Throwable t) {}
                  forget(c, chatId);
              }

              static synchronized JSONArray gone(Context c, String chatId) {
                  try {
                      long t = sp(c).getLong("gone_t_" + chatId, 0);
                      if (t == 0 || System.currentTimeMillis() - t > 20000) return new JSONArray();
                      String s = sp(c).getString("gone_" + chatId, null);
                      return s == null ? new JSONArray() : new JSONArray(s);
                  } catch (Throwable e) {
                      return new JSONArray();
                  }
              }

              // Sadece depoyu temizler (bildirim kullanıcı tarafından kaydırılıp kapatıldığında)
              static synchronized void forget(Context c, String chatId) {
                  sp(c).edit().remove("chat_" + chatId).remove("meta_" + chatId).putLong("dbg_forget", System.currentTimeMillis()).apply();
              }

              // Bildirimi kaldırır ve depoyu temizler (sohbet açıldığında / okundu işaretlendiğinde)
              static void clearChat(Context c, String chatId) {
                  if (chatId == null || chatId.isEmpty()) return;
                  forget(c, chatId);
                  try { sp(c).edit().remove("gone_" + chatId).remove("gone_t_" + chatId).apply(); } catch (Throwable t) {}
                  try {
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.cancel("chat_" + chatId, 1);
                  } catch (Exception e) {}
              }

              // ---------- gelen mesaj ----------
              static void show(Context c, Map<String, String> d) {
                  try {
                      String chatId = d.get("chatId");
                      if (chatId == null || chatId.isEmpty()) return;
                      String title = d.get("title");
                      String body = d.get("body");
                      if (title == null || title.isEmpty()) title = "AuraChat";
                      if (body == null) body = "";
                      String tag = d.get("tag");
                      boolean group = "1".equals(d.get("isGroup"));

                      JSONArray arr = stored(c, chatId);

                      if (DELETED.equals(body) && tag != null && !tag.isEmpty()) {
                          boolean found = false;
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject o = arr.optJSONObject(i);
                              if (o != null && tag.equals(o.optString("tag"))) {
                                  o.put("text", DELETED);
                                  o.put("raw", DELETED);
                                  found = true;
                              }
                          }
                          if (!found) return;
                      } else {
                          String sender = title;
                          String text = body;
                          if (group) {
                              int i = body.indexOf(": ");
                              if (i > 0 && i <= 40) {
                                  sender = body.substring(0, i);
                                  text = body.substring(i + 2);
                              }
                          }
                          JSONObject o = new JSONObject();
                          o.put("tag", tag == null ? "" : tag);
                          o.put("text", text);
                          o.put("raw", body);
                          o.put("sender", sender);
                          String suid = d.get("senderUid");
                          o.put("senderUid", suid == null ? "" : suid);
                          o.put("t", System.currentTimeMillis());
                          o.put("me", false);
                          // Aynı mesajın bildirimi iki kez gelirse tekrar ekleme
                          if (tag != null && !tag.isEmpty()) {
                              for (int i = 0; i < arr.length(); i++) {
                                  JSONObject e = arr.optJSONObject(i);
                                  if (e != null && tag.equals(e.optString("tag"))) return;
                              }
                          }
                          arr.put(o);
                      }
                      save(c, chatId, arr);
                      try { sp(c).edit().putString("dbg_last", "n=" + arr.length() + " tag=" + (tag == null ? "yok" : (tag.length() > 6 ? tag.substring(0, 6) : tag))).apply(); } catch (Throwable ignoreD) {}

                      JSONObject m = new JSONObject();
                      m.put("title", title);
                      m.put("group", group);
                      m.put("otherUid", d.get("otherUid") == null ? "" : d.get("otherUid"));
                      m.put("otherName", d.get("otherName") == null ? title : d.get("otherName"));
                      m.put("otherAvatar", d.get("otherAvatar") == null ? "" : d.get("otherAvatar"));
                      m.put("body", body);
                      m.put("tag", tag == null ? "" : tag);
                      m.put("msgType", d.get("msgType") == null ? "" : d.get("msgType"));
                      sp(c).edit().putString("meta_" + chatId, m.toString()).apply();

                      ensureAvatar(c, chatId);
                      if (group) ensureAvatarFor(c, chatId, d.get("senderUid"));
                      post(c, chatId, false);
                  } catch (Exception e) {}
              }

              // ---------- bildirimden verilen cevap ----------
              static void appendMine(Context c, String chatId, String text) {
                  try {
                      JSONArray arr = stored(c, chatId);
                      JSONObject o = new JSONObject();
                      o.put("tag", "");
                      o.put("text", text);
                      o.put("raw", text);
                      o.put("sender", "");
                      o.put("senderUid", "");
                      o.put("t", System.currentTimeMillis());
                      o.put("me", true);
                      arr.put(o);
                      save(c, chatId, arr);
                      post(c, chatId, true);
                  } catch (Exception e) {}
              }

              static void appendFailure(Context c, String chatId) {
                  try {
                      JSONArray arr = stored(c, chatId);
                      JSONObject o = new JSONObject();
                      o.put("tag", "");
                      o.put("text", "⚠️ Cevap gönderilemedi");
                      o.put("raw", "");
                      o.put("sender", "AuraChat");
                      o.put("senderUid", "aura-system");
                      o.put("t", System.currentTimeMillis());
                      o.put("me", false);
                      arr.put(o);
                      save(c, chatId, arr);
                      post(c, chatId, true);
                  } catch (Exception e) {}
              }

              // ---------- bildirimi çiz ----------
              private static void ensureChannel(Context c, NotificationManager nm) {
                  if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(CHANNEL) == null) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "Mesaj Bildirimleri", NotificationManager.IMPORTANCE_HIGH);
                      ch.setDescription("Yeni mesaj bildirimleri");
                      nm.createNotificationChannel(ch);
                  }
              }

              static int smallIcon(Context c) {
                  int id = c.getResources().getIdentifier("ic_stat_aura", "drawable", c.getPackageName());
                  return id != 0 ? id : c.getApplicationInfo().icon;
              }

              static void post(Context c, String chatId, boolean quiet) {
                  try {
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      ensureChannel(c, nm);

                      JSONArray arr = stored(c, chatId);
                      if (arr.length() == 0) return;
                      JSONObject meta = meta(c, chatId);
                      String title = meta.optString("title", "AuraChat");
                      boolean group = meta.optBoolean("group", false);

                      Person me = new Person.Builder().setName("Ben").setKey("aura-me").build();
                      NotificationCompat.MessagingStyle style = new NotificationCompat.MessagingStyle(me);
                      if (group) {
                          style.setConversationTitle(title);
                          style.setGroupConversation(true);
                      }

                      Bitmap avatar = cachedAvatar(c, chatId);
                      Map<String, Person> people = new HashMap<>();
                      long lastT = System.currentTimeMillis();
                      String lastText = "";
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.optJSONObject(i);
                          if (o == null) continue;
                          long t = o.optLong("t", System.currentTimeMillis());
                          String text = o.optString("text", "");
                          lastT = t;
                          lastText = text;
                          if (o.optBoolean("me", false)) {
                              style.addMessage(text, t, me);
                          } else {
                              String name = o.optString("sender", title);
                              String key = o.optString("senderUid", "");
                              if (key.isEmpty()) key = "n:" + name;
                              Person p = people.get(key);
                              if (p == null) {
                                  Bitmap personAv = group ? cachedAvatar(c, chatId + "|" + key) : avatar;
                                  p = new Person.Builder()
                                          .setName(name)
                                          .setKey(key)
                                          .setIcon(IconCompat.createWithBitmap(personAv != null ? personAv : initialsBitmap(name, 128)))
                                          .build();
                                  people.put(key, p);
                              }
                              style.addMessage(text, t, p);
                          }
                      }

                      // Bildirime dokununca sohbeti aç (FCM bildirimiyle aynı bilgiler)
                      Intent open = new Intent(c, MainActivity.class);
                      open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      open.putExtra("google.message_id", "aura-" + System.currentTimeMillis());
                      open.putExtra("title", title);
                      open.putExtra("chatId", chatId);
                      open.putExtra("otherUid", meta.optString("otherUid", ""));
                      open.putExtra("otherName", meta.optString("otherName", title));
                      open.putExtra("otherAvatar", meta.optString("otherAvatar", ""));
                      open.putExtra("body", meta.optString("body", ""));
                      open.putExtra("tag", meta.optString("tag", ""));
                      open.putExtra("msgType", meta.optString("msgType", ""));
                      // Bekleyen mesajlar bildirimin kendi bilgisine de konur: dokununca depoya bağlı kalmaz
                      try {
                          JSONArray pm = new JSONArray();
                          for (int pi2 = 0; pi2 < arr.length(); pi2++) {
                              JSONObject po = arr.optJSONObject(pi2);
                              if (po == null || po.optBoolean("me", false)) continue;
                              String ptg = po.optString("tag", "");
                              if (!ptg.startsWith("msg-")) continue;
                              JSONObject pj = new JSONObject();
                              pj.put("tag", ptg);
                              pj.put("text", po.optString("raw", po.optString("text", "")));
                              pj.put("t", po.optLong("t", 0));
                              pm.put(pj);
                          }
                          open.putExtra("msgsJson", pm.toString());
                      } catch (Exception ignoreP) {}
                      int imm = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                      PendingIntent openPi = PendingIntent.getActivity(c, chatId.hashCode(), open, PendingIntent.FLAG_UPDATE_CURRENT | imm);

                      // Cevapla
                      RemoteInput ri = new RemoteInput.Builder(KEY_REPLY).setLabel("Mesaj yaz").build();
                      Intent replyIntent = new Intent(c, AuraActionReceiver.class).setAction(ACT_REPLY)
                              .setData(Uri.parse("aura://reply/" + chatId)).putExtra("chatId", chatId);
                      int mut = Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0;
                      PendingIntent replyPi = PendingIntent.getBroadcast(c, chatId.hashCode(), replyIntent, PendingIntent.FLAG_UPDATE_CURRENT | mut);
                      NotificationCompat.Action replyAction = new NotificationCompat.Action.Builder(0, "Cevapla", replyPi)
                              .addRemoteInput(ri)
                              .setAllowGeneratedReplies(true)
                              .setSemanticAction(NotificationCompat.Action.SEMANTIC_ACTION_REPLY)
                              .setShowsUserInterface(false)
                              .build();

                      // Okundu olarak işaretle
                      Intent readIntent = new Intent(c, AuraActionReceiver.class).setAction(ACT_READ)
                              .setData(Uri.parse("aura://read/" + chatId)).putExtra("chatId", chatId);
                      PendingIntent readPi = PendingIntent.getBroadcast(c, chatId.hashCode(), readIntent, PendingIntent.FLAG_UPDATE_CURRENT | imm);
                      NotificationCompat.Action readAction = new NotificationCompat.Action.Builder(0, "Okundu olarak işaretle", readPi)
                              .setSemanticAction(NotificationCompat.Action.SEMANTIC_ACTION_MARK_AS_READ)
                              .setShowsUserInterface(false)
                              .build();

                      // Sessize al
                      Intent muteIntent = new Intent(c, AuraActionReceiver.class).setAction(ACT_MUTE)
                              .setData(Uri.parse("aura://mute/" + chatId)).putExtra("chatId", chatId);
                      PendingIntent mutePi = PendingIntent.getBroadcast(c, chatId.hashCode(), muteIntent, PendingIntent.FLAG_UPDATE_CURRENT | imm);
                      NotificationCompat.Action muteAction = new NotificationCompat.Action.Builder(0, "Sessize al", mutePi)
                              .setSemanticAction(NotificationCompat.Action.SEMANTIC_ACTION_MUTE)
                              .setShowsUserInterface(false)
                              .build();

                      // Kaydırıp kapatınca depoyu temizle
                      Intent clearIntent = new Intent(c, AuraActionReceiver.class).setAction(ACT_CLEAR)
                              .setData(Uri.parse("aura://clear/" + chatId)).putExtra("chatId", chatId);
                      PendingIntent clearPi = PendingIntent.getBroadcast(c, chatId.hashCode(), clearIntent, PendingIntent.FLAG_UPDATE_CURRENT | imm);

                      // Android 11+: kısayol tanımlanınca bildirim "konuşma" görünümü alır
                      // (büyük avatar, sağ altında uygulama ikonu, yanında ad ve süre)
                      String shortcutId = "chat_" + chatId;
                      publishShortcut(c, shortcutId, title, avatar);

                      NotificationCompat.Builder b = new NotificationCompat.Builder(c, CHANNEL)
                              .setSmallIcon(smallIcon(c))
                              .setColor(ACCENT)
                              .setShortcutId(shortcutId)
                              .setLocusId(new LocusIdCompat(shortcutId))
                              .setContentTitle(title)
                              .setContentText(lastText)
                              .setStyle(style)
                              .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setAutoCancel(false)
                              .setShowWhen(true)
                              .setWhen(lastT)
                              .setOnlyAlertOnce(quiet)
                              .setContentIntent(openPi)
                              .setDeleteIntent(clearPi)
                              .addAction(replyAction)
                              .addAction(readAction)
                              .addAction(muteAction)
                              .setLargeIcon(avatar != null ? avatar : initialsBitmap(title, 192));

                      nm.notify("chat_" + chatId, 1, b.build());
                  } catch (Exception e) {}
              }

                                          static void publishShortcut(Context c, String sid, String title, Bitmap avatar) {
                  try {
                      android.content.SharedPreferences sp = c.getSharedPreferences("aura_slots", Context.MODE_PRIVATE);
                      int slot = -1;
                      for (int n = 0; n < 6; n++) {
                          if (sid.equals(sp.getString("slot" + n, ""))) { slot = n; break; }
                      }
                      if (slot < 0) {
                          for (int n = 0; n < 6; n++) {
                              if (sp.getString("slot" + n, "").isEmpty()) { slot = n; break; }
                          }
                      }
                      if (slot < 0) {
                          slot = sp.getInt("next", 0) % 6;
                          String old = sp.getString("slot" + slot, "");
                          if (!old.isEmpty()) ShortcutManagerCompat.removeDynamicShortcuts(c, java.util.Arrays.asList(old));
                          sp.edit().putInt("next", slot + 1).apply();
                      }
                      sp.edit().putString("slot" + slot, sid).apply();
                      IconCompat icon = IconCompat.createWithBitmap(avatar != null ? avatar : initialsBitmap(title, 128));
                      Person target = new Person.Builder().setName(title).setKey(sid).setIcon(icon).build();
                      Intent i = new Intent(c, MainActivity.class).setAction(Intent.ACTION_VIEW);
                      ShortcutInfoCompat sc = new ShortcutInfoCompat.Builder(c, sid)
                              .setShortLabel(title)
                              .setLongLived(true)
                              .setCategories(new java.util.HashSet<String>(java.util.Arrays.asList("com.aurachat.slot" + slot)))
                              .setIntent(i)
                              .setPerson(target)
                              .setIcon(icon)
                              .build();
                      ShortcutManagerCompat.pushDynamicShortcut(c, sc);
                  } catch (Throwable t) {}
              }

              // Arama gibi tek satırlık bildirimler (aynı tag ile eskisinin yerine geçer)
              static void showSimple(Context c, Map<String, String> d) {
                  try {
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      ensureChannel(c, nm);
                      String title = d.get("title");
                      String body = d.get("body");
                      String tag = d.get("tag");
                      if (title == null || title.isEmpty()) title = "AuraChat";
                      if (body == null) body = "";
                      Intent open = new Intent(c, MainActivity.class);
                      open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      open.putExtra("google.message_id", "aura-" + System.currentTimeMillis());
                      open.putExtra("title", title);
                      open.putExtra("body", body);
                      open.putExtra("tag", tag == null ? "" : tag);
                      String[] keys = new String[]{"chatId", "otherUid", "otherName", "otherAvatar", "msgType"};
                      for (String k : keys) {
                          if (d.get(k) != null) open.putExtra(k, d.get(k));
                      }
                      int imm = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                      String cid = d.get("chatId") == null ? "x" : d.get("chatId");
                      PendingIntent pi = PendingIntent.getActivity(c, ("s" + cid).hashCode(), open, PendingIntent.FLAG_UPDATE_CURRENT | imm);
                      NotificationCompat.Builder b = new NotificationCompat.Builder(c, CHANNEL)
                              .setSmallIcon(smallIcon(c))
                              .setColor(ACCENT)
                              .setContentTitle(title)
                              .setContentText(body)
                              .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setAutoCancel(true)
                              .setContentIntent(pi)
                              .setLargeIcon(initialsBitmap(title, 192));
                      nm.notify(tag == null || tag.isEmpty() ? null : tag, 0, b.build());
                  } catch (Exception e) {}
              }

              // ---------- baş harf daireleri ----------
              static Bitmap initialsBitmap(String name, int size) {
                  Bitmap bm = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  try {
                      int[] palette = new int[]{0xFF7C3AED, 0xFFDB2777, 0xFF0EA5E9, 0xFF059669, 0xFFEA580C, 0xFF4F46E5, 0xFFC026D3, 0xFF0D9488};
                      String n = name == null ? "" : name.trim();
                      int color = palette[Math.abs(n.hashCode()) % palette.length];
                      String initials = "?";
                      if (!n.isEmpty()) {
                          String[] words = n.split("\\s+");
                          StringBuilder sb = new StringBuilder();
                          for (int i = 0; i < words.length && sb.length() < 2; i++) {
                              if (words[i].isEmpty()) continue;
                              int cp = words[i].codePointAt(0);
                              sb.appendCodePoint(cp);
                          }
                          if (sb.length() > 0) initials = sb.toString().toUpperCase();
                      }
                      Canvas cv = new Canvas(bm);
                      Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                      p.setColor(color);
                      cv.drawCircle(size / 2f, size / 2f, size / 2f, p);
                      p.setColor(0xFFFFFFFF);
                      p.setTextSize(size * 0.42f);
                      p.setFakeBoldText(true);
                      Rect r = new Rect();
                      p.getTextBounds(initials, 0, initials.length(), r);
                      float x = size / 2f - r.exactCenterX();
                      float y = size / 2f - r.exactCenterY();
                      cv.drawText(initials, x, y, p);
                  } catch (Throwable t) {}
                  return bm;
              }

              // ---------- avatar (karşı kişinin profil resmi) ----------
              private static File avatarFile(Context c, String chatId) {
                  return new File(c.getApplicationContext().getFilesDir(), "avatar_" + Math.abs(chatId.hashCode()) + ".png");
              }

              static Bitmap cachedAvatar(Context c, String chatId) {
                  try {
                      File f = avatarFile(c, chatId);
                      if (!f.exists()) return null;
                      return BitmapFactory.decodeFile(f.getAbsolutePath());
                  } catch (Throwable t) {
                      return null;
                  }
              }

              // Önbellekte yoksa ya da 12 saatten eskiyse sunucudan indirir (kısa zaman aşımı)
              static void ensureAvatar(Context c, String chatId) { ensureAvatarFor(c, chatId, null); }

              static void ensureAvatarFor(Context c, String chatId, String uid) {
                  try {
                      String key = (uid == null || uid.isEmpty()) ? chatId : chatId + "|" + uid;
                      File f = avatarFile(c, key);
                      if (f.exists() && System.currentTimeMillis() - f.lastModified() < 12L * 3600 * 1000) return;
                      String resp = callServerRaw(c, "avatar", chatId, (uid == null || uid.isEmpty()) ? null : uid, 3500);
                      if (resp == null) return;
                      String av = new JSONObject(resp).optString("avatar", "");
                      if (av.isEmpty()) return;
                      Bitmap src = null;
                      if (av.startsWith("data:")) {
                          int comma = av.indexOf(',');
                          if (comma < 0) return;
                          byte[] bytes = Base64.decode(av.substring(comma + 1), Base64.DEFAULT);
                          src = BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                      } else if (av.startsWith("http")) {
                          HttpURLConnection con = (HttpURLConnection) new URL(av).openConnection();
                          con.setConnectTimeout(3000);
                          con.setReadTimeout(3000);
                          InputStream in = con.getInputStream();
                          src = BitmapFactory.decodeStream(in);
                          in.close();
                          con.disconnect();
                      }
                      if (src == null) return;
                      int side = Math.min(src.getWidth(), src.getHeight());
                      Bitmap sq = Bitmap.createBitmap(src, (src.getWidth() - side) / 2, (src.getHeight() - side) / 2, side, side);
                      Bitmap out = Bitmap.createScaledBitmap(sq, 192, 192, true);
                      FileOutputStream fo = new FileOutputStream(f);
                      out.compress(Bitmap.CompressFormat.PNG, 100, fo);
                      fo.close();
                  } catch (Throwable t) {}
              }

              // ---------- fotoğrafı telefona indir ----------
              static void fetchImages(Context c, String chatId) {
                  try {
                      if (chatId == null || chatId.isEmpty()) return;
                      String resp = callServerExtra(c, "images", chatId, null, 15000);
                      if (resp == null) return;
                      JSONArray items = new JSONObject(resp).optJSONArray("items");
                      if (items == null || items.length() == 0) return;
                      // WhatsApp gibi: uygulama medya klasörü (galeride görünmez). Olmazsa Pictures/AuraChat'e düş
                      File outDir = null;
                      try {
                          File[] dirs = c.getExternalMediaDirs();
                          if (dirs != null && dirs.length > 0 && dirs[0] != null) {
                              File md = new File(dirs[0], "AuraChat/Media/AuraChat Images");
                              if (md.exists() || md.mkdirs()) {
                                  outDir = md;
                                  try { new File(md, ".nomedia").createNewFile(); } catch (Throwable t) {}
                              }
                          }
                      } catch (Throwable t) { outDir = null; }
                      if (outDir == null) {
                          File pics = new File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_PICTURES), "AuraChat");
                          if (!pics.exists() && !pics.mkdirs()) return;
                          outDir = pics;
                      }
                      java.text.SimpleDateFormat fmt = new java.text.SimpleDateFormat("yyyyMMdd_HHmmss", java.util.Locale.US);
                      JSONArray acked = new JSONArray();
                      for (int i = 0; i < items.length(); i++) {
                          JSONObject it = items.optJSONObject(i);
                          if (it == null) continue;
                          String id = it.optString("id", "");
                          JSONArray imgs = it.optJSONArray("imgs");
                          if (id.isEmpty() || imgs == null || imgs.length() == 0) continue;
                          boolean album = it.optBoolean("album", false);
                          String stamp = fmt.format(new java.util.Date(it.optLong("t", System.currentTimeMillis())));
                          boolean ok = true;
                          for (int k = 0; k < imgs.length(); k++) {
                              String b = imgs.optString(k, "");
                              int comma = b.indexOf(',');
                              if (comma >= 0) b = b.substring(comma + 1);
                              byte[] bytes = Base64.decode(b, Base64.DEFAULT);
                              String name = "AuraChat_" + stamp + "_" + id + (album ? "_" + (k + 1) : "") + ".jpg";
                              File f = new File(outDir, name);
                              FileOutputStream fo = null;
                              try {
                                  fo = new FileOutputStream(f);
                                  fo.write(bytes);
                              } catch (Throwable t) {
                                  ok = false;
                              } finally {
                                  try { if (fo != null) fo.close(); } catch (Throwable t) {}
                              }
                              if (!f.exists() || f.length() != bytes.length) ok = false;
                          }
                          if (ok) acked.put(id);
                      }
                      if (acked.length() > 0) callServerExtra(c, "ackimages", chatId, acked, 8000);
                  } catch (Throwable t) {}
              }

              // ---------- ses ve belgeyi telefona indir ----------
              static String audioExtOf(String dataUrl) {
                  try {
                      if (dataUrl == null || !dataUrl.startsWith("data:audio/")) return "webm";
                      int end = dataUrl.indexOf(';');
                      int end2 = dataUrl.indexOf(',');
                      if (end < 0 || (end2 >= 0 && end2 < end)) end = end2;
                      if (end < 0) return "webm";
                      String t = dataUrl.substring("data:audio/".length(), end).toLowerCase();
                      if (t.equals("mp4") || t.equals("x-m4a") || t.equals("m4a")) return "m4a";
                      if (t.equals("mpeg") || t.equals("mp3")) return "mp3";
                      if (t.equals("ogg")) return "ogg";
                      if (t.equals("wav") || t.equals("x-wav") || t.equals("wave")) return "wav";
                      if (t.equals("aac")) return "aac";
                  } catch (Throwable t) {}
                  return "webm";
              }

              static void fetchMedia(Context c, String chatId) {
                  try {
                      if (chatId == null || chatId.isEmpty()) return;
                      String resp = callServerExtra(c, "media", chatId, null, 15000);
                      if (resp == null) return;
                      JSONArray items = new JSONObject(resp).optJSONArray("items");
                      if (items == null || items.length() == 0) return;
                      java.text.SimpleDateFormat fmt = new java.text.SimpleDateFormat("yyyyMMdd_HHmmss", java.util.Locale.US);
                      JSONArray acked = new JSONArray();
                      for (int i = 0; i < items.length(); i++) {
                          JSONObject it = items.optJSONObject(i);
                          if (it == null) continue;
                          String id = it.optString("id", "");
                          String kind = it.optString("kind", "");
                          String b = it.optString("data", "");
                          if (id.isEmpty() || b.isEmpty()) continue;
                          String head = b;
                          int comma = b.indexOf(',');
                          if (comma >= 0) b = b.substring(comma + 1);
                          byte[] bytes = Base64.decode(b, Base64.DEFAULT);
                          File f = null;
                          if (kind.equals("audio")) {
                              File[] dirs = c.getExternalMediaDirs();
                              if (dirs == null || dirs.length == 0 || dirs[0] == null) continue;
                              File ad = new File(dirs[0], "AuraChat/Media/AuraChat Audio");
                              if (!(ad.exists() || ad.mkdirs())) continue;
                              try { new File(ad, ".nomedia").createNewFile(); } catch (Throwable t) {}
                              String stamp = fmt.format(new java.util.Date(it.optLong("t", System.currentTimeMillis())));
                              f = new File(ad, "AuraChat_" + stamp + "_" + id + "." + audioExtOf(head));
                          } else if (kind.equals("doc")) {
                              File dd = new File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), "AuraChat");
                              if (!(dd.exists() || dd.mkdirs())) continue;
                              String fn = it.optString("fileName", "");
                              if (fn.isEmpty()) fn = "belge";
                              String safe = fn.replaceAll("[\\\\/:*?\"<>|]+", "_");
                              int dot = safe.lastIndexOf('.');
                              String uniq = id.length() >= 4 ? id.substring(0, 4) : id;
                              String saved = dot > 0 ? safe.substring(0, dot) + " (" + uniq + ")" + safe.substring(dot) : safe + " (" + uniq + ")";
                              f = new File(dd, saved);
                          }
                          if (f == null) continue;
                          boolean ok = true;
                          FileOutputStream fo = null;
                          try {
                              fo = new FileOutputStream(f);
                              fo.write(bytes);
                          } catch (Throwable t) {
                              ok = false;
                          } finally {
                              try { if (fo != null) fo.close(); } catch (Throwable t) {}
                          }
                          if (!f.exists() || f.length() != bytes.length) ok = false;
                          if (ok) acked.put(id);
                      }
                      if (acked.length() > 0) callServerExtra(c, "ackmedia", chatId, acked, 8000);
                  } catch (Throwable t) {}
              }

              // ---------- mesajı telefondaki sohbet kaydına yaz (msg_cache/<chatId>.json) ----------
              // Kayıt dosyası yoksa ya da sunucu "kısmi" derse (resim/ses/belge var) hiçbir şey yazılmaz; uygulama açılınca normal yoldan gelir.
              static void syncMessages(Context c, String chatId) {
                  try {
                      if (chatId == null || chatId.isEmpty() || chatId.contains("/") || chatId.contains("..")) return;
                      File f = new File(new File(c.getFilesDir(), "msg_cache"), chatId + ".json");
                      if (!f.exists() || f.length() == 0 || f.length() > 8L * 1024 * 1024) return;
                      java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                      InputStream fin = new java.io.FileInputStream(f);
                      byte[] rb = new byte[16384];
                      int rn;
                      while ((rn = fin.read(rb)) > 0) bo.write(rb, 0, rn);
                      fin.close();
                      JSONObject root = new JSONObject(bo.toString("UTF-8"));
                      JSONArray msgs = root.optJSONArray("messages");
                      if (msgs == null || msgs.length() == 0) return;
                      long last = 0;
                      for (int i = 0; i < msgs.length(); i++) {
                          JSONObject mo = msgs.optJSONObject(i);
                          JSONObject md = mo == null ? null : mo.optJSONObject("data");
                          if (md != null) last = Math.max(last, md.optLong("createdAt", 0));
                      }
                      if (last <= 0) return;
                      String resp = callServerSync(c, chatId, last, 10000);
                      if (resp == null) return;
                      JSONObject rj = new JSONObject(resp);
                      if (rj.optBoolean("partial", true)) return;
                      JSONArray items = rj.optJSONArray("items");
                      if (items == null || items.length() == 0) return;
                      java.util.LinkedHashMap<String, JSONObject> byId = new java.util.LinkedHashMap<String, JSONObject>();
                      for (int i = 0; i < msgs.length(); i++) {
                          JSONObject mo = msgs.optJSONObject(i);
                          if (mo != null) byId.put(mo.optString("id", ""), mo);
                      }
                      for (int i = 0; i < items.length(); i++) {
                          JSONObject it = items.optJSONObject(i);
                          if (it == null) continue;
                          String id = it.optString("id", "");
                          if (id.isEmpty() || it.optJSONObject("data") == null) continue;
                          byId.put(id, it);
                      }
                      java.util.ArrayList<JSONObject> all = new java.util.ArrayList<JSONObject>(byId.values());
                      java.util.Collections.sort(all, new java.util.Comparator<JSONObject>() {
                          public int compare(JSONObject a, JSONObject b) {
                              long ta = a.optJSONObject("data") == null ? 0 : a.optJSONObject("data").optLong("createdAt", 0);
                              long tb = b.optJSONObject("data") == null ? 0 : b.optJSONObject("data").optLong("createdAt", 0);
                              return ta < tb ? -1 : (ta > tb ? 1 : 0);
                          }
                      });
                      int from = Math.max(0, all.size() - 50);
                      JSONArray outArr = new JSONArray();
                      for (int i = from; i < all.size(); i++) outArr.put(all.get(i));
                      root.put("messages", outArr);
                      File tmp = new File(f.getParentFile(), chatId + ".json.tmp");
                      FileOutputStream fo = new FileOutputStream(tmp);
                      fo.write(root.toString().getBytes("UTF-8"));
                      fo.close();
                      if (!tmp.renameTo(f)) { f.delete(); tmp.renameTo(f); }
                  } catch (Throwable t) {}
              }

              static String callServerSync(Context c, String chatId, long afterMs, int timeoutMs) {
                  try {
                      SharedPreferences s = sp(c);
                      String rt = s.getString("rt", "");
                      if (rt == null || rt.isEmpty()) return null;
                      JSONObject j = new JSONObject();
                      j.put("refreshToken", rt);
                      j.put("action", "msgsync");
                      j.put("chatId", chatId);
                      j.put("afterMs", afterMs);
                      HttpURLConnection con = (HttpURLConnection) new URL(API).openConnection();
                      con.setRequestMethod("POST");
                      con.setConnectTimeout(timeoutMs);
                      con.setReadTimeout(timeoutMs);
                      con.setDoOutput(true);
                      con.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                      OutputStream os = con.getOutputStream();
                      os.write(j.toString().getBytes("UTF-8"));
                      os.close();
                      if (con.getResponseCode() != 200) { con.disconnect(); return null; }
                      InputStream in = con.getInputStream();
                      java.io.ByteArrayOutputStream bos = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) bos.write(buf, 0, n);
                      in.close();
                      con.disconnect();
                      return bos.toString("UTF-8");
                  } catch (Throwable t) {
                      return null;
                  }
              }

              static String callServerExtra(Context c, String action, String chatId, JSONArray ids, int timeoutMs) {
                  try {
                      SharedPreferences s = sp(c);
                      String rt = s.getString("rt", "");
                      if (rt == null || rt.isEmpty()) return null;
                      JSONObject j = new JSONObject();
                      j.put("refreshToken", rt);
                      j.put("action", action);
                      j.put("chatId", chatId);
                      if (ids != null) j.put("ids", ids);
                      HttpURLConnection con = (HttpURLConnection) new URL(API).openConnection();
                      con.setRequestMethod("POST");
                      con.setConnectTimeout(timeoutMs);
                      con.setReadTimeout(timeoutMs);
                      con.setDoOutput(true);
                      con.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                      OutputStream os = con.getOutputStream();
                      os.write(j.toString().getBytes("UTF-8"));
                      os.close();
                      if (con.getResponseCode() != 200) { con.disconnect(); return null; }
                      InputStream in = con.getInputStream();
                      java.io.ByteArrayOutputStream bos = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) bos.write(buf, 0, n);
                      in.close();
                      con.disconnect();
                      return bos.toString("UTF-8");
                  } catch (Throwable t) {
                      return null;
                  }
              }

              // ---------- sunucuya istek ----------
              static boolean callServer(Context c, String action, String chatId, String text) {
                  return callServerRaw(c, action, chatId, text, 8000) != null;
              }

              // Başarılıysa yanıt gövdesini, değilse null döner
              static String callServerRaw(Context c, String action, String chatId, String text, int timeoutMs) {
                  try {
                      SharedPreferences s = sp(c);
                      String rt = s.getString("rt", "");
                      if (rt == null || rt.isEmpty()) return null;
                      JSONObject j = new JSONObject();
                      j.put("refreshToken", rt);
                      j.put("action", action);
                      j.put("chatId", chatId);
                      if (text != null) j.put("text", text);
                      HttpURLConnection con = (HttpURLConnection) new URL(API).openConnection();
                      con.setRequestMethod("POST");
                      con.setConnectTimeout(timeoutMs);
                      con.setReadTimeout(timeoutMs);
                      con.setDoOutput(true);
                      con.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                      OutputStream os = con.getOutputStream();
                      os.write(j.toString().getBytes("UTF-8"));
                      os.close();
                      int code = con.getResponseCode();
                      if (code != 200) { con.disconnect(); return null; }
                      InputStream in = con.getInputStream();
                      java.io.ByteArrayOutputStream bos = new java.io.ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) bos.write(buf, 0, n);
                      in.close();
                      con.disconnect();
                      return bos.toString("UTF-8");
                  } catch (Throwable t) {
                      return null;
                  }
              }
          }
          EOF
            cat > "$DIR/AuraActionReceiver.java" << 'EOF'
          package com.aurachat.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.Toast;
          import androidx.core.app.RemoteInput;

          // Bildirimdeki "Cevapla", "Okundu olarak işaretle" düğmeleri ve bildirimin kaydırılıp kapatılması
          public class AuraActionReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(final Context context, Intent intent) {
                  if (intent == null) return;
                  final String action = intent.getAction();
                  final String chatId = intent.getStringExtra("chatId");
                  if (action == null || chatId == null || chatId.isEmpty()) return;
                  final Context app = context.getApplicationContext();

                  if (AuraNotif.ACT_CLEAR.equals(action)) {
                      AuraNotif.stashAndForget(app, chatId);
                      return;
                  }

                  if (AuraNotif.ACT_READ.equals(action)) {
                      AuraNotif.clearChat(app, chatId);
                      final PendingResult pr = goAsync();
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  AuraNotif.callServer(app, "read", chatId, null);
                              } finally {
                                  pr.finish();
                              }
                          }
                      }).start();
                      return;
                  }

                  if (AuraNotif.ACT_MUTE.equals(action)) {
                      AuraNotif.clearChat(app, chatId);
                      final PendingResult pr = goAsync();
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  final boolean ok = AuraNotif.callServer(app, "mute", chatId, null);
                                  new Handler(Looper.getMainLooper()).post(new Runnable() {
                                      @Override
                                      public void run() {
                                          Toast.makeText(app, ok ? "Sohbet sessize al\u0131nd\u0131" : "Sessize al\u0131namad\u0131", Toast.LENGTH_SHORT).show();
                                      }
                                  });
                              } finally {
                                  pr.finish();
                              }
                          }
                      }).start();
                      return;
                  }

                  if (AuraNotif.ACT_REPLY.equals(action)) {
                      Bundle results = RemoteInput.getResultsFromIntent(intent);
                      CharSequence cs = results == null ? null : results.getCharSequence(AuraNotif.KEY_REPLY);
                      final String text = cs == null ? "" : cs.toString().trim();
                      if (text.isEmpty()) {
                          AuraNotif.post(app, chatId, true);
                          return;
                      }
                      // Cevap hemen bildirimde görünsün (dönen çubuk kalkar)
                      AuraNotif.appendMine(app, chatId, text);
                      final PendingResult pr = goAsync();
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  boolean ok = AuraNotif.callServer(app, "reply", chatId, text);
                                  if (!ok) AuraNotif.appendFailure(app, chatId);
                              } finally {
                                  pr.finish();
                              }
                          }
                      }).start();
                  }
              }
          }
