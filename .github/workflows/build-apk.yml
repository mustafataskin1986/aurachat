name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoriyi Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sabit Dijital İmza (Keystore) Oluştur
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12
          fi

      - name: Bağımlılıkları Yükle
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install --legacy-peer-deps @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor-community/contacts@5.0.5

      - name: Web Dosyalarını Hazırla ve Konfigüre Et
        run: |
          rm -rf www
          mkdir -p www
          cp -r *.html *.js *.json *.css www/ 2>/dev/null || true
          cp -r js static assets css www/ 2>/dev/null || true
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.aurachat.app",
            "appName": "AuraChat",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://aurachat-amber.vercel.app",
              "cleartext": true
            }
          }
          EOF

      - name: Capacitor Android Ekle ve Senkronize Et
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Android İzinlerini Manifest'e Ekle
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "READ_CONTACTS" "$MANIFEST_PATH"; then
              sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_CONTACTS" \/>' "$MANIFEST_PATH"
            fi
          fi

      - name: APK Derle (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını Çıktı Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: AuraChat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
