              m = Image.new("L", (size * 4, size * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, size * 4 - 1, size * 4 - 1), fill=255)
              m = m.resize((size, size), Image.LANCZOS)
              out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              out.paste(im, (0, 0), m)
              return out

          os.makedirs(RES + "/values", exist_ok=True)
          os.makedirs(RES + "/mipmap-anydpi-v26", exist_ok=True)
          colors = []
          made = []
          for n in range(1, 16):
              src = "static/icons/ikon-%d.png" % n
              if not os.path.exists(src):
                  continue
              im = Image.open(src).convert("RGBA")
              bg = im.getpixel((4, 4))
              if bg[3] < 255:
                  bg_hex = "#00000000"   # şeffaf ikon: arka plan şeffaf kalsın
              else:
                  bg_hex = "#%02x%02x%02x" % (bg[0], bg[1], bg[2])
              colors.append('    <color name="aura_alt_bg_%d">%s</color>' % (n, bg_hex))
              for dens, size in legacy.items():
                  p = "%s/mipmap-%s" % (RES, dens)
                  os.makedirs(p, exist_ok=True)
                  im.resize((size, size), Image.LANCZOS).save("%s/ic_alt_%d.png" % (p, n))
                  im.resize((size, size), Image.LANCZOS).save("%s/ic_alt_%d_round.png" % (p, n))
              made.append(n)

          if colors:
              open(RES + "/values/aura_alt_colors.xml", "w").write(
                  '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n' + "\n".join(colors) + '\n</resources>\n')

          # Manifest: MainActivity'nin LAUNCHER'ını kaldır, simge takma adlarını ekle
          m = open(MANIFEST, encoding="utf-8").read()
          if "IconDefault" not in m:
              m = m.replace('<category android:name="android.intent.category.LAUNCHER" />', '')
              filt = ('<intent-filter><action android:name="android.intent.action.MAIN" />'
                      '<category android:name="android.intent.category.LAUNCHER" /></intent-filter>')
              al = ('    <activity-alias android:name=".IconDefault" android:targetActivity=".MainActivity" android:exported="true" '
                    'android:enabled="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" '
                    'android:label="AuraChat">' + filt + '</activity-alias>\n')
              for n in made:
                  al += ('    <activity-alias android:name=".IconAlt%d" android:targetActivity=".MainActivity" android:exported="true" '
                         'android:enabled="false" android:icon="@mipmap/ic_alt_%d" android:roundIcon="@mipmap/ic_alt_%d_round" '
                         'android:label="AuraChat">' % (n, n, n) + filt + '</activity-alias>\n')
              m = m.replace("</application>", al + "</application>")
              open(MANIFEST, "w", encoding="utf-8").write(m)
          print("Simge secenekleri:", made)
          PY

      - name: Sistem Açılış Logosu Üret
        run: |
          pip install pillow --quiet
          python3 - << 'PY'
          import os
          from PIL import Image, ImageDraw

          S = 4
          PX = 864
          N = PX * S
          d = 3 * S
          cx = cy = N // 2

          def grad(n, stops):
              img = Image.new("RGBA", (n, n))
              px = img.load()
              k = len(stops) - 1
              for y in range(n):
                  for x in range(n):
                      t = (x + y) / (2.0 * (n - 1))
                      i = min(int(t * k), k - 1)
                      f = t * k - i
                      a, b = stops[i], stops[i + 1]
                      px[x, y] = tuple(int(a[j] + (b[j] - a[j]) * f) for j in range(3)) + (255,)
              return img

          canvas = Image.new("RGBA", (N, N), (0, 0, 0, 0))

          # Dış çember (gradient, %85 opaklık)
          rs = int(104 * d)
          ring = grad(256, [(219, 39, 119), (147, 51, 234), (79, 70, 229)]).resize((rs, rs), Image.LANCZOS)
          rmask = Image.new("L", (rs, rs), 0)
          ImageDraw.Draw(rmask).ellipse((0, 0, rs - 1, rs - 1), fill=217)
          ring.putalpha(rmask)
          canvas.alpha_composite(ring, (cx - rs // 2, cy - rs // 2))

          # İç siyah daire
          r = int(49 * d)
          ImageDraw.Draw(canvas).ellipse((cx - r, cy - r, cx + r, cy + r), fill=(0, 0, 0, 255))

          # Değnek ikonu
          u = 42.0 * d / 24.0
          left = cx - 21 * d
          top = cy - 21 * d
          segs = [(15, 4, 15, 2), (15, 16, 15, 14), (8, 9, 10, 9), (20, 9, 22, 9),
                  (17.8, 11.8, 19, 13), (17.8, 6.2, 19, 5), (12.2, 6.2, 11, 5),
                  (3, 21, 12, 12), (12.2, 11.8, 11, 13)]
          wmask = Image.new("L", (N, N), 0)
          wd = ImageDraw.Draw(wmask)
          lw = 1.8 * u
          for (x1, y1, x2, y2) in segs:
              p1 = (left + x1 * u, top + y1 * u)
              p2 = (left + x2 * u, top + y2 * u)
              wd.line([p1, p2], fill=255, width=int(lw))
              for (px_, py_) in (p1, p2):
                  wd.ellipse((px_ - lw / 2, py_ - lw / 2, px_ + lw / 2, py_ + lw / 2), fill=255)
          isz = int(42 * d)
          ig = grad(256, [(192, 132, 252), (244, 114, 182), (56, 189, 248)]).resize((isz, isz), Image.LANCZOS)
          gfull = Image.new("RGBA", (N, N), (0, 0, 0, 0))
          gfull.paste(ig, (int(left), int(top)))
          canvas.paste(gfull, (0, 0), wmask)

          out = canvas.resize((PX, PX), Image.LANCZOS)
          p = "android/app/src/main/res/drawable-xxhdpi"
          os.makedirs(p, exist_ok=True)
          out.save(p + "/aura_splash_icon.png")
          print("aura_splash_icon.png uretildi")

          # Varsayılan: halka içinde sihirli değnek (sabit vektör; sistem açılış ekranı çizer)
          RESD = "android/app/src/main/res"
          custom = "static/icons/splash-logo.png"
          if not os.path.exists(custom):
              os.makedirs(RESD + "/drawable", exist_ok=True)
              try:
                  os.remove(RESD + "/drawable-xxhdpi/aura_splash_icon.png")
              except OSError:
                  pass
              open(RESD + "/drawable/aura_splash_icon.xml", "w").write('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="288dp"
              android:height="288dp"
              android:viewportWidth="288"
              android:viewportHeight="288">
              <group android:name="pulse" android:pivotX="144" android:pivotY="144">
                  <path android:pathData="M92,144 A52,52 0 1,1 196,144 A52,52 0 1,1 92,144 Z">
            <aapt:attr name="android:fillColor">
                <gradient android:type="linear" android:startX="92" android:startY="92" android:endX="196" android:endY="196">
                    <item android:offset="0" android:color="#FF4F46E5"/>
                    <item android:offset="0.4" android:color="#FF9333EA"/>
                    <item android:offset="0.7" android:color="#FFDB2777"/>
                    <item android:offset="1" android:color="#FF06B6D4"/>
                </gradient>
            </aapt:attr>
                  </path>
                  <path android:fillColor="#FF000000" android:pathData="M95,144 A49,49 0 1,1 193,144 A49,49 0 1,1 95,144 Z"/>
                  <group android:translateX="123" android:translateY="123" android:scaleX="1.75" android:scaleY="1.75">
            <path
                android:strokeWidth="1.8"
                android:strokeLineCap="round"
                android:strokeLineJoin="round"
                android:pathData="M15,4 L15,2 M15,16 L15,14 M8,9 L10,9 M20,9 L22,9 M17.8,11.8 L19,13 M17.8,6.2 L19,5 M12.2,6.2 L11,5 M3,21 L12,12 M12.2,11.8 L11,13">
                <aapt:attr name="android:strokeColor">
                    <gradient android:type="linear" android:startX="0" android:startY="0" android:endX="24" android:endY="24">
                        <item android:offset="0" android:color="#FFC084FC"/>
                        <item android:offset="0.5" android:color="#FFF472B6"/>
                        <item android:offset="1" android:color="#FF38BDF8"/>
                    </gradient>
                </aapt:attr>
            </path>
                  </group>
              </group>
          </vector>
          ''')
              print("Acilis logosu (vektor) yazildi")

          # Kendi açılış logonu kullanmak için: static/icons/splash-logo.png dosyasını ekle (şeffaf PNG, kare önerilir; sabit durur)
          if os.path.exists(custom):
              lg = Image.open(custom).convert("RGBA")
              box = 432
              lg.thumbnail((box, box), Image.LANCZOS)
              cv = Image.new("RGBA", (PX, PX), (0, 0, 0, 0))
              cv.paste(lg, ((PX - lg.width) // 2, (PX - lg.height) // 2), lg)
              cv.save("android/app/src/main/res/drawable-xxhdpi/aura_splash_icon.png")
              print("Ozel acilis logosu kullanildi:", custom)

          # Seçilebilir uygulama ikonları için açılış ekranı logoları + temaları (ikon değişince açılışta o ikon görünür)
          RESX = "android/app/src/main/res"
          themes = ['    <style name="AppTheme.Splash0" parent="AppTheme.NoActionBarLaunch">',
                    '        <item name="windowSplashScreenAnimatedIcon">@drawable/aura_splash_icon</item>',
                    '    </style>']
          for n in range(1, 16):
              src = "static/icons/ikon-%d.png" % n
              if not os.path.exists(src):
                  continue
              im = Image.open(src).convert("RGBA")
              LS = 360
              im = im.resize((LS, LS), Image.LANCZOS)
              m4 = Image.new("L", (LS * 4, LS * 4), 0)
              ImageDraw.Draw(m4).ellipse((0, 0, LS * 4 - 1, LS * 4 - 1), fill=255)
              m4 = m4.resize((LS, LS), Image.LANCZOS)
              cv = Image.new("RGBA", (PX, PX), (0, 0, 0, 0))
              cv.paste(im, ((PX - LS) // 2, (PX - LS) // 2), m4)
              cv.save("%s/drawable-xxhdpi/aura_splash_alt_%d.png" % (RESX, n))
              themes += ['    <style name="AppTheme.Splash%d" parent="AppTheme.NoActionBarLaunch">' % n,
                         '        <item name="windowSplashScreenAnimatedIcon">@drawable/aura_splash_alt_%d</item>' % n,
                         '    </style>']
          PY

      - name: APK Derle (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını Çıktı Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: AuraChat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

      - name: APK'yı Sabit Release Bağlantısına Yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AuraChat.apk
          STAMP="Son derleme: $(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M') - commit ${GITHUB_SHA::7}"
          # Sürümü her derlemede silip yeniden oluştur: sayfadaki tarih, etiket ve commit de güncellensin (indirme bağlantısı aynı kalır)
          gh release delete apk-latest --cleanup-tag -y > /dev/null 2>&1 || true
          if ! gh release create apk-latest AuraChat.apk --title "AuraChat APK" --notes "$STAMP" --target "$GITHUB_SHA" --latest; then
            gh release view apk-latest > /dev/null 2>&1 || gh release create apk-latest --title "AuraChat APK" --notes "$STAMP" --latest
            gh release upload apk-latest AuraChat.apk --clobber
            gh release edit apk-latest --notes "$STAMP"
          fi

      - name: Eski Çıktıları ve Kayıtları Temizle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' | while read id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" > /dev/null || echo "SILINEMEDI artifact: $id"
          done
          gh api --paginate "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status=="completed") | .id' \
            | grep -v "^${{ github.run_id }}$" | tail -n +3 | while read id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" > /dev/null || echo "SILINEMEDI kayit: $id"
          done
          exit 0