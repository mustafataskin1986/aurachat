      - name: AuraSplash.java - Uygulama açılır açılmaz native splash
        run: |
          MAIN_ACTIVITY=$(find android -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            SPLASH_FILE="$(dirname "$MAIN_ACTIVITY")/AuraSplash.java"
            cat > "$SPLASH_FILE" << 'EOF'
          package com.aurachat.app;

          import android.animation.ValueAnimator;
          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          // Uygulama açılır açılmaz (sayfa internetten inmeden) çizilen splash.
          // JS tarafı (js/splash.js) window.AuraSplash.hide() çağırınca yumuşakça kapanır.
          public class AuraSplash {
              private static View overlay = null;
              private static boolean hidden = false;
              // true: sistem açılış ekranı (logo) ekranda kalır; JS "hide" deyince kalkar
              static volatile boolean keep = true;
              // true: sistem açılış ekranı (siyah) tutulur; kendi ikon ekranımız çizilince bırakılır
              static volatile boolean sysKeep = true;
              private static ValueAnimator beat = null;
              private static volatile boolean beating = false;

              public static void show(final Activity activity, WebView webView) {
                  try {
                      hidden = false;
                      keep = true;
                      // Sistem ekranındaki logonun aynısı üstüne çizilir (aynı merkez, aynı boyut) ve kalp atışı gibi atar.
                      // Sistem ekranı bu çizilene kadar tutulur, çizilince bırakılır.
                      sysKeep = true;
                      try {
                          final android.widget.FrameLayout root = new android.widget.FrameLayout(activity);
                          root.setBackgroundColor(Color.BLACK);
                          root.setClickable(true);
                          // Sistem ekranındaki logoyla aynı görünüm. Atış, telefonun animasyon ayarlarından (animasyon ölçeği,
                          // pil tasarrufu) bağımsız, her karede zamana göre elle hesaplanır.
                          int resId = activity.getResources().getIdentifier("aura_splash_vec", "drawable", activity.getPackageName());
                          if (resId == 0) resId = activity.getResources().getIdentifier("aura_splash_icon", "drawable", activity.getPackageName());
                          if (resId != 0) {
                              final android.widget.ImageView iv = new android.widget.ImageView(activity);
                              iv.setImageResource(resId);
                              iv.setScaleType(android.widget.ImageView.ScaleType.FIT_CENTER);
                              int px = (int) (288f * activity.getResources().getDisplayMetrics().density);
                              root.addView(iv, new android.widget.FrameLayout.LayoutParams(px, px, android.view.Gravity.CENTER));
                              beating = true;
                              final long t0 = android.os.SystemClock.uptimeMillis();
                              iv.postOnAnimation(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (!beating) return;
                                      float t = ((android.os.SystemClock.uptimeMillis() - t0) % 1300L) / 1300f;
                                      float sc = 1f;
                                      if (t < 0.14f) sc = 1f + 0.12f * (t / 0.14f);
                                      else if (t < 0.28f) sc = 1.12f - 0.12f * ((t - 0.14f) / 0.14f);
                                      else if (t < 0.42f) sc = 1f + 0.08f * ((t - 0.28f) / 0.14f);
                                      else if (t < 0.56f) sc = 1.08f - 0.08f * ((t - 0.42f) / 0.14f);
                                      iv.setScaleX(sc);
                                      iv.setScaleY(sc);
                                      iv.postOnAnimation(this);
                                  }
                              });
                          }
                          overlay = root;
                          // Pencerenin tamamına (durum çubuğu dahil) yerleştir: sistem ekranındaki logoyla aynı merkez, kayma olmaz
                          ((ViewGroup) activity.getWindow().getDecorView()).addView(root, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          root.post(new Runnable() {
                              @Override
                              public void run() { sysKeep = false; }
                          });
                      } catch (Throwable t) { sysKeep = false; }
                      if (webView != null) webView.addJavascriptInterface(new Bridge(activity), "AuraSplash");
                      // Güvenlik: sayfa hiç yüklenmezse bile splash sonsuza kadar kalmasın
                      new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                          @Override
                          public void run() { hide(activity); }
                      }, 8000);
                  } catch (Throwable t) {}
              }

              // Sistem açılış penceresiyle aynı görünüm: siyah zemin + o an seçili uygulama ikonu (hareketsiz)
              static View buildIconOverlay(Activity a) {
                  android.widget.FrameLayout root = new android.widget.FrameLayout(a);
                  root.setBackgroundColor(Color.BLACK);
                  root.setClickable(true);
                  try {
                      android.content.pm.PackageManager pm = a.getPackageManager();
                      android.graphics.drawable.Drawable ic = null;
                      for (int n = 0; n <= 15 && ic == null; n++) {
                          try {
                              android.content.ComponentName cn = new android.content.ComponentName(a.getPackageName(),
                                  "com.aurachat.app." + (n == 0 ? "IconDefault" : "IconAlt" + n));
                              int st = pm.getComponentEnabledSetting(cn);
                              boolean on = st == android.content.pm.PackageManager.COMPONENT_ENABLED_STATE_ENABLED
                                  || (st == android.content.pm.PackageManager.COMPONENT_ENABLED_STATE_DEFAULT && n == 0);
                              if (on) ic = pm.getActivityIcon(cn);
                          } catch (Throwable t) {}
                      }
                      if (ic == null) ic = pm.getApplicationIcon(a.getPackageName());
                      android.widget.ImageView iv = new android.widget.ImageView(a);
                      iv.setImageDrawable(ic);
                      iv.setScaleType(android.widget.ImageView.ScaleType.FIT_CENTER);
                      int px = (int) (240f * a.getResources().getDisplayMetrics().density);
                      root.addView(iv, new android.widget.FrameLayout.LayoutParams(px, px, android.view.Gravity.CENTER));
                  } catch (Throwable t) {}
                  return root;
              }

              public static void hide(final Activity activity) {
                  keep = false;
                  sysKeep = false;
                  beating = false;
                  activity.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          if (hidden || overlay == null) return;
                          hidden = true;
                          final View v = overlay;
                          overlay = null;
                          v.animate().alpha(0f).setDuration(300).withEndAction(new Runnable() {
                              @Override
                              public void run() {
                                  try { if (beat != null) { beat.cancel(); beat = null; } } catch (Throwable t) {}
                                  try {
                                      ViewGroup p = (ViewGroup) v.getParent();
                                      if (p != null) p.removeView(v);
                                  } catch (Throwable t) {}
                              }
                          }).start();
                      }
                  });
              }

              public static class Bridge {
                  private final Activity activity;
                  public Bridge(Activity activity) { this.activity = activity; }
                  @JavascriptInterface
                  public void hide() { AuraSplash.hide(activity); }
              }

              static class SplashView extends View {
                  private final float d;
                  private final Paint glowP = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint ringP = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint innerP = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint iconP = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint textP = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Path wand = new Path();
                  private float pulse = 0f;
                  private ValueAnimator anim;

                  SplashView(Context c) {
                      super(c);
                      d = c.getResources().getDisplayMetrics().density;
                      setBackgroundColor(Color.BLACK);
                      setClickable(true);
                      innerP.setColor(Color.BLACK);
                      iconP.setStyle(Paint.Style.STROKE);
                      iconP.setStrokeCap(Paint.Cap.ROUND);
                      iconP.setStrokeJoin(Paint.Join.ROUND);
                      iconP.setStrokeWidth(1.8f);
                      textP.setTypeface(Typeface.create("sans-serif", Typeface.BOLD));
                      textP.setFakeBoldText(true);
                      textP.setTextSize(40f * d);
                      wand.moveTo(15f, 4f);     wand.lineTo(15f, 2f);
                      wand.moveTo(15f, 16f);    wand.lineTo(15f, 14f);
                      wand.moveTo(8f, 9f);      wand.lineTo(10f, 9f);
                      wand.moveTo(20f, 9f);     wand.lineTo(22f, 9f);
                      wand.moveTo(17.8f, 11.8f); wand.lineTo(19f, 13f);
                      wand.moveTo(17.8f, 6.2f);  wand.lineTo(19f, 5f);
                      wand.moveTo(12.2f, 6.2f);  wand.lineTo(11f, 5f);
                      wand.moveTo(3f, 21f);     wand.lineTo(12f, 12f);
                      wand.moveTo(12.2f, 11.8f); wand.lineTo(11f, 13f);
                  }

                  @Override
                  protected void onAttachedToWindow() {
                      super.onAttachedToWindow();
                      anim = ValueAnimator.ofFloat(0f, 1f);
                      anim.setDuration(1200);
                      anim.setRepeatCount(ValueAnimator.INFINITE);
                      anim.setRepeatMode(ValueAnimator.REVERSE);
                      anim.addUpdateListener(new ValueAnimator.AnimatorUpdateListener() {
                          @Override
                          public void onAnimationUpdate(ValueAnimator a) {
                              pulse = (Float) a.getAnimatedValue();
                              invalidate();
                          }
                      });
                      anim.start();
                  }

                  @Override
                  protected void onDetachedFromWindow() {
                      super.onDetachedFromWindow();
                      if (anim != null) anim.cancel();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      float w = getWidth(), h = getHeight();
                      float cx = w / 2f, cy = h / 2f;
                      try {
                          int[] loc = new int[2];
                          getLocationOnScreen(loc);
                          int rootH = getRootView().getHeight();
                          if (rootH > 0) cy = rootH / 2f - loc[1];
                      } catch (Throwable t) {}

                      // Arka parıltı
                      float a = 0.6f + 0.4f * pulse;
                      float gr = 368f * d * (1f + 0.08f * pulse);
                      glowP.setShader(new RadialGradient(cx, cy, gr,
                              new int[]{ Color.argb((int) (89 * a), 147, 51, 234), Color.argb((int) (31 * a), 219, 39, 119), Color.TRANSPARENT },
                              new float[]{ 0f, 0.45f, 0.7f }, Shader.TileMode.CLAMP));
                      canvas.drawCircle(cx, cy, gr, glowP);

                      // Logo bloğu ekranın ortasında (çember + 22dp boşluk + yazı)
                      float top = cy - 52f * d;
                      float ringCy = top + 52f * d;

                      ringP.setShader(new LinearGradient(cx - 52f * d, ringCy - 52f * d, cx + 52f * d, ringCy + 52f * d,
                              new int[]{ 0xFFDB2777, 0xFF9333EA, 0xFF4F46E5 }, null, Shader.TileMode.CLAMP));
                      ringP.setAlpha(217);
                      canvas.drawCircle(cx, ringCy, 52f * d, ringP);
                      canvas.drawCircle(cx, ringCy, 49f * d, innerP);

                      // Sihirli değnek ikonu
                      canvas.save();
                      canvas.translate(cx - 21f * d, ringCy - 21f * d);
                      float s = 42f * d / 24f;
                      canvas.scale(s, s);
                      iconP.setShader(new LinearGradient(0f, 0f, 24f, 24f,
                              new int[]{ 0xFFC084FC, 0xFFF472B6, 0xFF38BDF8 }, null, Shader.TileMode.CLAMP));
                      canvas.drawPath(wand, iconP);
                      canvas.restore();

                      // AuraChat yazısı
                      float textTop = top + 126f * d;
                      Paint.FontMetrics fm = textP.getFontMetrics();
                      float baseline = textTop + 23.5f * d - (fm.ascent + fm.descent) / 2f;
                      float wA = textP.measureText("Aura");
                      float wC = textP.measureText("Chat");
                      float x0 = cx - (wA + wC) / 2f;
                      textP.setShader(null);
                      textP.setColor(0xFFF3F4F6);
                      canvas.drawText("Aura", x0, baseline, textP);
                      textP.setShader(new LinearGradient(x0 + wA, 0f, x0 + wA + wC, 0f,
                              new int[]{ 0xFFC084FC, 0xFFF472B6, 0xFF38BDF8 }, null, Shader.TileMode.CLAMP));
                      canvas.drawText("Chat", x0 + wA, baseline, textP);
                      textP.setShader(null);
                  }
              }
          }
          EOF
            echo "AuraSplash.java yazıldı."
          else
            echo "UYARI: MainActivity.java bulunamadı, AuraSplash yazılamadı!"
          fi

      - name: AuraScreen.java - Ekran paylaşımı (ekran yakalama köprüsü ve hizmeti)
        run: |
          MAIN_ACTIVITY=$(find android -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            DIR="$(dirname "$MAIN_ACTIVITY")"
            cat > "$DIR/AuraScreen.java" << 'EOF'
          package com.aurachat.app;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebView;
          import androidx.activity.ComponentActivity;
          import androidx.activity.result.ActivityResult;
          import androidx.activity.result.ActivityResultCallback;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.activity.result.ActivityResultLauncher;

          // Ekran paylaşımı (telefonun TAMAMI): Android'in ekran yakalama izni + ön plan hizmeti.
          // Kareler JPEG olarak JS'e (js/screen-share.js) gönderilir, orada WebRTC'ye bağlanır.
          public class AuraScreen {
              static volatile WebView webView = null;
              static ComponentActivity activity = null;
              private static ActivityResultLauncher<Intent> launcher = null;
              private static ActivityResultLauncher<String> permLauncher = null;
              static final java.util.concurrent.atomic.AtomicInteger audioInflight = new java.util.concurrent.atomic.AtomicInteger(0);
              static volatile boolean busy = false;
              static volatile boolean sharing = false;
              static volatile boolean pendingH264 = false;   // sonraki başlatma H.264 ile mi?
              static volatile boolean needKey = false;       // zincir koptu: sonraki anahtar kareyi bekle
              static final java.util.concurrent.atomic.AtomicInteger inflight = new java.util.concurrent.atomic.AtomicInteger(0);
              private static final Handler main = new Handler(Looper.getMainLooper());

              public static void install(final ComponentActivity act, WebView wv) {
                  activity = act;
                  webView = wv;
                  try {
                      launcher = act.registerForActivityResult(new ActivityResultContracts.StartActivityForResult(), new ActivityResultCallback<ActivityResult>() {
                          @Override
                          public void onActivityResult(ActivityResult r) {
                              try {
                                  if (r.getResultCode() == Activity.RESULT_OK && r.getData() != null) {
                                      Intent svc = new Intent(act, AuraScreenService.class);
                                      svc.putExtra("code", r.getResultCode());
                                      svc.putExtra("data", r.getData());
                                      svc.putExtra("h264", pendingH264);
                                      if (Build.VERSION.SDK_INT >= 26) act.startForegroundService(svc);
                                      else act.startService(svc);
                                  } else {
                                      js("window.__auraScreenDenied&&window.__auraScreenDenied()");
                                  }
                              } catch (Throwable t) {
                                  js("window.__auraScreenDenied&&window.__auraScreenDenied()");
                              }
                          }
                      });
                  } catch (Throwable t) { launcher = null; }
                  // Telefonun iç sesini yakalamak için mikrofon izni gerekir (Android 10+). Verilmese de görüntü paylaşılır.
                  try {
                      permLauncher = act.registerForActivityResult(new ActivityResultContracts.RequestPermission(), new ActivityResultCallback<Boolean>() {
                          @Override
                          public void onActivityResult(Boolean granted) { launchProjection(); }
                      });
                  } catch (Throwable t) { permLauncher = null; }
                  if (wv != null) wv.addJavascriptInterface(new Bridge(), "AuraScreen");
              }

              static void js(final String code) {
                  main.post(new Runnable() {
                      @Override
                      public void run() {
                          try { if (webView != null) webView.evaluateJavascript(code, null); } catch (Throwable t) {}
                      }
                  });
              }

              // Yakalama hizmeti kare üretince çağırır. JS bir önceki kareyi işlemeden yenisi gönderilmez.
              static void sendFrame(final String b64) {
                  if (busy) return;
                  busy = true;
                  main.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (webView == null) { busy = false; return; }
                              // Uygulama arka plandayken sayfa zamanlayıcıları yavaşlamasın
                              try { webView.resumeTimers(); } catch (Throwable t) {}
                              webView.evaluateJavascript("window.__auraScreenFrame&&window.__auraScreenFrame('" + b64 + "')", new ValueCallback<String>() {
                                  @Override
                                  public void onReceiveValue(String v) { busy = false; }
                              });
                          } catch (Throwable t) { busy = false; }
                      }
                  });
                  // Güvenlik: geri dönüş gelmezse kilit açılsın
                  main.postDelayed(new Runnable() {
                      @Override
                      public void run() { busy = false; }
                  }, 1500);
              }

              // H.264 ayar paketi (SPS/PPS) ve kareler: JS'e base64 olarak gider. JS yetişemezse (3'ten fazla bekleyen)
              // delta kareler atılır ve yeni anahtar kare istenir, böylece gecikme birikmez.
              static void sendH264Config(final String b64, final int w, final int h) {
                  main.post(new Runnable() {
                      @Override
                      public void run() {
                          try { if (webView != null) webView.evaluateJavascript("window.__auraScreenCfg&&window.__auraScreenCfg('" + b64 + "'," + w + "," + h + ")", null); } catch (Throwable t) {}
                      }
                  });
              }

              static void sendH264(final String b64, final boolean key, final long ptsMs) {
                  if (needKey && !key) return;
                  if (!key && inflight.get() > 3) {
                      needKey = true;
                      AuraScreenService.requestKeyFrameStatic();
                      return;
                  }
                  if (key) needKey = false;
                  inflight.incrementAndGet();
                  main.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (webView == null) { inflight.decrementAndGet(); return; }
                              try { webView.resumeTimers(); } catch (Throwable t) {}
                              webView.evaluateJavascript("window.__auraScreenH264&&window.__auraScreenH264('" + b64 + "'," + (key ? 1 : 0) + "," + ptsMs + ")", new ValueCallback<String>() {
                                  @Override
                                  public void onReceiveValue(String v) { inflight.decrementAndGet(); }
                              });
                          } catch (Throwable t) { inflight.decrementAndGet(); }
                      }
                  });
              }

              // İç ses: 24 kHz, mono, 16 bit PCM parçaları (base64). JS yetişemezse parça atılır.
              static void sendAudio(final String b64) {
                  if (audioInflight.get() > 6) return;
                  audioInflight.incrementAndGet();
                  main.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (webView == null) { audioInflight.decrementAndGet(); return; }
                              webView.evaluateJavascript("window.__auraScreenAudio&&window.__auraScreenAudio('" + b64 + "')", new ValueCallback<String>() {
                                  @Override
                                  public void onReceiveValue(String v) { audioInflight.decrementAndGet(); }
                              });
                          } catch (Throwable t) { audioInflight.decrementAndGet(); }
                      }
                  });
              }

              static void launchProjection() {
                  try {
                      if (launcher == null || activity == null) { js("window.__auraScreenDenied&&window.__auraScreenDenied()"); return; }
                      MediaProjectionManager mpm = (MediaProjectionManager) activity.getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      launcher.launch(mpm.createScreenCaptureIntent());
                  } catch (Throwable t) {
                      js("window.__auraScreenDenied&&window.__auraScreenDenied()");
                  }
              }

              static void notifyStarted() {
                  sharing = true;
                  needKey = false;
                  audioInflight.set(0);
                  inflight.set(0);
                  js("window.__auraScreenStarted&&window.__auraScreenStarted()");
              }

              static void notifyStopped() {
                  sharing = false;
                  busy = false;
                  js("window.__auraScreenStopped&&window.__auraScreenStopped()");
              }

              public static class Bridge {
                  @JavascriptInterface
                  public boolean isSupported() {
                      return launcher != null && Build.VERSION.SDK_INT >= 23;
                  }

                  @JavascriptInterface
                  public boolean isSharing() { return sharing; }

                  // Cihazın H.264 donanım/yazılım kodlayıcısı var mı?
                  @JavascriptInterface
                  public boolean supportsH264() {
                      try {
                          if (Build.VERSION.SDK_INT < 23) return false;
                          android.media.MediaCodec c = android.media.MediaCodec.createEncoderByType("video/avc");
                          c.release();
                          return true;
                      } catch (Throwable t) { return false; }
                  }

                  // İzleyen yeni bir anahtar kare isterse / JS geri kaldıysa
                  @JavascriptInterface
                  public void requestKeyFrame() { AuraScreenService.requestKeyFrameStatic(); }

                  @JavascriptInterface
                  public void startWithMode(final boolean h264) {
                      pendingH264 = h264;
                      doStart();
                  }

                  // Eski çağrı (JPEG yöntemi): H.264 kapalı
                  @JavascriptInterface
