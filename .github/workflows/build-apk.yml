                          @Override
                          public void run() {
                              try {
                                  if (launcher == null || activity == null) { js("window.__auraScreenDenied&&window.__auraScreenDenied()"); return; }
                                  // H.264 modunda iç ses için mikrofon izni (bir kez sorulur); sonra ekran yakalama izni
                                  if (pendingH264 && Build.VERSION.SDK_INT >= 29 && permLauncher != null
                                      && activity.checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                                      permLauncher.launch(android.Manifest.permission.RECORD_AUDIO);
                                      return;
                                  }
                                  launchProjection();
                              } catch (Throwable t) {
                                  js("window.__auraScreenDenied&&window.__auraScreenDenied()");
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void stop() {
                      main.post(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (activity != null) activity.stopService(new Intent(activity, AuraScreenService.class));
                              } catch (Throwable t) {}
                              notifyStopped();
                          }
                      });
                  }
              }
          }
