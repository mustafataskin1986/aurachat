name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoriyi Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Keystore Secret Var mı Kontrol Et
        id: checksecret
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Kayıtlı Keystore'u Secret'tan Yükle (SABİT SHA-1)
        if: steps.checksecret.outputs.exists == 'true'
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          echo "Kayıtlı keystore kullanılıyor, SHA-1 sabit kalacak."

      - name: Geçici Keystore Üret (secret henüz yok)
        if: steps.checksecret.outputs.exists == 'false'
        run: |
          echo "UYARI: ANDROID_KEYSTORE_BASE64 secret'ı henüz ayarlanmamış."
          rm -rf ~/.android/debug.keystore
          mkdir -p ~/.android
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12

      - name: Bağımlılıkları Yükle
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install --legacy-peer-deps \
            @capacitor/core@5.7.0 \
            @capacitor/cli@5.7.0 \
            @capacitor/android@5.7.0 \
            @capacitor/app@5.0.7 \
            @capacitor-community/contacts@5.0.5 \
            @codetrix-studio/capacitor-google-auth@3.3.0 \
            @capacitor/push-notifications@5.1.0 \
            @capacitor/camera@5.0.7 \
            @capacitor/filesystem@5.2.1 \
            @capacitor/share@5.0.7 \
            @capacitor/haptics@5.0.6

      - name: Web Dosyalarını Hazırla ve Konfigüre Et
        run: |
          rm -rf www
          mkdir -p www
          cp -r *.html *.js *.json *.css www/ 2>/dev/null || true
          cp -r js static assets css www/ 2>/dev/null || true
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.aurachat.app",
            "appName": "AuraChat",
            "webDir": "www",
            "bundledWebRuntime": false,
            "backgroundColor": "#000000",
            "server": {
              "url": "https://aurachat-amber.vercel.app",
              "cleartext": true
            },
            "plugins": {
              "GoogleAuth": {
                "scopes": ["profile", "email"],
                "serverClientId": "447747395966-3shresouu36769er1b9656oec8vd13aa.apps.googleusercontent.com",
                "forceCodeForRefreshToken": true
              },
              "PushNotifications": {
                "presentationOptions": ["badge", "sound", "alert"]
              }
            }
          }
          EOF

      - name: Capacitor Android Ekle ve Senkronize Et
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: MainActivity.java - WebView Önbellek Ayarı Ekle
        run: |
          MAIN_ACTIVITY=$(find android -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            cat > "$MAIN_ACTIVITY" << 'EOF'
          package com.aurachat.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import android.webkit.WebSettings;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Matrix;
          import android.net.Uri;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.ArrayList;
          import org.json.JSONArray;
          import android.app.Notification;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.service.notification.StatusBarNotification;
          import android.view.WindowManager;
          import androidx.activity.OnBackPressedCallback;
          import android.webkit.ValueCallback;

          public class MainActivity extends BridgeActivity {
              // Uygulama ekranda mı? (AuraMessagingService, uygulama açıkken arama bildirimi göstermesin diye bakar)
              static volatile boolean inForeground = false;
              

              // JS, uygulamanın kendi "Gelen arama" ekranı açılınca telefonun arama bildirimini kapatır
              public class CallBridge {
                  @JavascriptInterface
                  public void cancelCallNotifications() {
                      clearCallNotifications();
                  }
              }

              @Override
              public void onStart() {
                  super.onStart();
                  inForeground = true;
              }

              @Override
              public void onStop() {
                  super.onStop();
                  inForeground = false;
                  // Kilit ekranının üstünde görünme izni sadece gelen arama içindi
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(false);
                      setTurnScreenOn(false);
                  }
              }

              // Gelen arama bildirimiyle (tam ekran ya da dokunarak) açıldıysa kilit ekranının üstünde göster
              private void handleCallIntent(Intent intent) {
                  if (intent == null || !intent.getBooleanExtra("aura_call", false)) return;
                  intent.removeExtra("aura_call");
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  } else {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                  }
              }

              private void clearCallNotifications() {
                  try {
                      if (Build.VERSION.SDK_INT < 26) return;
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      for (StatusBarNotification sbn : nm.getActiveNotifications()) {
                          Notification n = sbn.getNotification();
                          if (n != null && AuraMessagingService.CALL_CHANNEL_ID.equals(n.getChannelId())) {
                              nm.cancel(sbn.getTag(), sbn.getId());
                          }
                      }
                  } catch (Exception e) {}
              }

              private volatile String pendingSharedJson = null;
              private volatile boolean shareBusy = false;
                            private volatile String pendingShareTarget = "";
                                          private volatile String pendingShareDiag = "";
              private volatile String launchChatJson = "";

            // JS, sohbet temasının rengini bildirir; seçim tutamakları bu renge boyanır
              public class NotifBridge {
                  @JavascriptInterface
                  public void setSession(String uid, String refreshToken) {
                      AuraNotif.setSession(getApplicationContext(), uid, refreshToken);
                  }
                  @JavascriptInterface
                  public void clearSession() {
                      AuraNotif.clearSession(getApplicationContext());
                  }
                  @JavascriptInterface
                  public void clearChat(String chatId) {
                      AuraNotif.clearChat(getApplicationContext(), chatId);
                  }
                                    // Paylaş menüsünde son sohbetler kişi olarak çıksın (Direct Share)
                  @JavascriptInterface
                  public void publishShortcut(String chatId, String title, String avatarDataUrl) {
                      try {
                          Bitmap bmp = null;
                          if (avatarDataUrl != null && avatarDataUrl.indexOf(",") > 0) {
                              byte[] raw = android.util.Base64.decode(avatarDataUrl.substring(avatarDataUrl.indexOf(",") + 1), android.util.Base64.DEFAULT);
                              bmp = BitmapFactory.decodeByteArray(raw, 0, raw.length);
                              if (bmp != null && (bmp.getWidth() > 192 || bmp.getHeight() > 192)) {
                                  bmp = Bitmap.createScaledBitmap(bmp, 192, 192, true);
                              }
                          }
                          AuraNotif.publishShortcut(getApplicationContext(), "chat_" + chatId, title == null ? "" : title, bmp);
                      } catch (Throwable t) {}
                  }
              }

              public class ThemeBridge {
                  @JavascriptInterface
                  public void setAccent(final String hex) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  String h = hex == null ? "" : hex.replace("#", "").toLowerCase();
                                  int id = getResources().getIdentifier("AuraAccent_" + h, "style", getPackageName());
                                  if (id != 0) getTheme().applyStyle(id, true);
                              } catch (Throwable t) {}
                          }
                      });
                  }
              }

              // Uygulama bildirime tıklanarak soğuk açıldıysa sohbet bilgisini JS'e HEMEN verir (bir kez)
              public class LaunchBridge {
                  @JavascriptInterface
                  public String consume() {
                      String s = launchChatJson;
                      launchChatJson = "";
                      return s;
                  }
              }

              private void captureLaunchChat(Intent intent) {
                  try {
                      if (intent == null || intent.getExtras() == null) return;
                      if (!intent.hasExtra("google.message_id")) return;
                      String otherUid = intent.getStringExtra("otherUid");
                      if (otherUid == null || otherUid.isEmpty()) return;
                      org.json.JSONObject o = new org.json.JSONObject();
                      o.put("uid", otherUid);
                      String n = intent.getStringExtra("otherName");
                      o.put("name", (n == null || n.isEmpty()) ? "Sohbet" : n);
                      String a = intent.getStringExtra("otherAvatar");
                      o.put("avatar", a == null ? "" : a);
                      String b = intent.getStringExtra("body");
                      o.put("body", b == null ? "" : b);
                      String tg = intent.getStringExtra("tag");
                      o.put("tag", tg == null ? "" : tg);
                      String cid = intent.getStringExtra("chatId");
                      o.put("chatId", cid == null ? "" : cid);
                      String mt = intent.getStringExtra("msgType");
                      o.put("msgType", mt == null ? "" : mt);
                      launchChatJson = o.toString();
                  } catch (Throwable t) {}
              }

            // Bildirimle açılışta, aynı kişiden bildirim çubuğunda bekleyen mesaj sayısını launch bilgisine ekler
              private void addPendingCount(Intent intent) {
                  try {
                      if (launchChatJson == null || launchChatJson.isEmpty() || intent == null) return;
                      // Yeni sistem: bekleyen mesajlar AuraNotif deposunda
                      String storedChat = intent.getStringExtra("chatId");
                      if (storedChat != null && !storedChat.isEmpty()) {
                          org.json.JSONArray st = AuraNotif.stored(this, storedChat);
                          if (st.length() > 0) {
                              org.json.JSONArray smsgs = new org.json.JSONArray();
                              for (int i = 0; i < st.length(); i++) {
                                  org.json.JSONObject so = st.optJSONObject(i);
                                  if (so == null || so.optBoolean("me", false)) continue;
                                  String stg = so.optString("tag", "");
                                  if (!stg.startsWith("msg-")) continue;
                                  org.json.JSONObject mo = new org.json.JSONObject();
                                  mo.put("tag", stg);
                                  mo.put("text", so.optString("raw", so.optString("text", "")));
                                  mo.put("t", so.optLong("t", 0));
                                  smsgs.put(mo);
                              }
                              org.json.JSONObject so2 = new org.json.JSONObject(launchChatJson);
                              so2.put("pending", Math.max(1, smsgs.length()));
                              so2.put("msgs", smsgs);
                              launchChatJson = so2.toString();
                              return;
                          }
                      }
                      String title = intent.getStringExtra("title");
                      int count = 1;
                      org.json.JSONArray msgs = new org.json.JSONArray();
                      if (title != null && Build.VERSION.SDK_INT >= 23) {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) {
                              for (StatusBarNotification sbn : nm.getActiveNotifications()) {
                                  Notification n = sbn.getNotification();
                                  if (n == null || n.extras == null) continue;
                                  CharSequence t = n.extras.getCharSequence(Notification.EXTRA_TITLE);
                                  if (t != null && title.contentEquals(t)) {
                                      count++;
                                      CharSequence tx = n.extras.getCharSequence(Notification.EXTRA_TEXT);
                                      String stag = sbn.getTag();
                                      if (tx != null && stag != null && stag.startsWith("msg-")) {
                                          org.json.JSONObject mo = new org.json.JSONObject();
                                          mo.put("tag", stag);
                                          mo.put("text", tx.toString());
                                          mo.put("t", sbn.getPostTime());
                                          msgs.put(mo);
                                      }
                                  }
                              }
                          }
                      }
                      org.json.JSONObject o = new org.json.JSONObject(launchChatJson);
                      o.put("pending", count);
                      o.put("msgs", msgs);
                      launchChatJson = o.toString();
                  } catch (Throwable t) {}
              }

              // JS buradan bekleyen paylaşımı alır: "" = yok, "busy" = hazırlanıyor, aksi halde resim listesi (JSON)
                            public class ShareBridge {
                  @JavascriptInterface
                  public String consume() {
                      if (shareBusy) return "busy";
                      String s = pendingSharedJson;
                      pendingSharedJson = null;
                      return s == null ? "" : s;
                  }

                  // Paylaşım menüsünde doğrudan bir sohbete dokunulduysa o sohbetin kimliği (yoksa "")
                  @JavascriptInterface
                  public String target() {
                      String t = pendingShareTarget;
                                            pendingShareTarget = "";
                      return t == null ? "" : t;
                  }

                  // Geçici: paylaşımla telefonun hangi bilgileri verdiğini gösterir
                  @JavascriptInterface
                  public String diag() {
                      return pendingShareDiag == null ? "" : pendingShareDiag;
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleShareIntent(intent);
                  handleCallIntent(intent);
                  clearChatFromIntent(intent);
              }

              // Bildirime dokunarak açılan sohbetin bildirim bloğunu kaldır
              private void clearChatFromIntent(Intent intent) {
                  try {
                      if (intent == null || !intent.hasExtra("google.message_id")) return;
                      String cid = intent.getStringExtra("chatId");
                      if (cid != null && !cid.isEmpty()) AuraNotif.clearChat(getApplicationContext(), cid);
                  } catch (Throwable t) {}
              }

              private void handleShareIntent(Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  if (!Intent.ACTION_SEND.equals(action) && !Intent.ACTION_SEND_MULTIPLE.equals(action)) return;
                                         String scId = intent.getStringExtra("android.intent.extra.shortcut.ID");
                  String scKeys = "";
                  try {
                      android.os.Bundle ex = intent.getExtras();
                      if (ex != null) {
                          scKeys = ex.keySet().toString();
                          if (scId == null) {
                              for (String k : ex.keySet()) {
                                  Object v = ex.get(k);
                                  if (v instanceof String && ((String) v).startsWith("chat_")) { scId = (String) v; break; }
                              }
                          }
                      }
                  } catch (Throwable t) {}
                  pendingShareTarget = (scId != null && scId.startsWith("chat_")) ? scId.substring(5) : "";
                  pendingShareDiag = "id=" + scId + " anahtarlar=" + scKeys;

                  final ArrayList<Uri> uris = new ArrayList<>();
                  if (Intent.ACTION_SEND.equals(action)) {
                      Uri single = intent.getParcelableExtra(Intent.EXTRA_STREAM);
                      if (single != null) uris.add(single);
                  } else {
                      ArrayList<Uri> many = intent.getParcelableArrayListExtra(Intent.EXTRA_STREAM);
                      if (many != null) uris.addAll(many);
                  }
                  // Aynı paylaşım ikinci kez işlenmesin
                  intent.setAction(null);
                  if (uris.isEmpty()) return;

                  shareBusy = true;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          JSONArray arr = new JSONArray();
                          int n = 0;
                          for (Uri uri : uris) {
                              if (n >= 10) break;
                              String d = shareUriToDataUrl(uri);
                              if (d != null) { arr.put(d); n++; }
                          }
                          pendingSharedJson = n > 0 ? arr.toString() : null;
                          shareBusy = false;
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      MainActivity.this.bridge.getWebView().evaluateJavascript("window.dispatchEvent(new Event('aurachat-share'))", null);
                                  } catch (Exception e) {}
                              }
                          });
                      }
                  }).start();
              }

              // Paylaşılan resmi 1600px'e küçültüp JPEG data URI'ye çevirir (yön bilgisi uygulanır)
              private String shareUriToDataUrl(Uri uri) {
                  try {
                      BitmapFactory.Options bounds = new BitmapFactory.Options();
                      bounds.inJustDecodeBounds = true;
                      InputStream is1 = getContentResolver().openInputStream(uri);
                      if (is1 == null) return null;
                      BitmapFactory.decodeStream(is1, null, bounds);
                      is1.close();

                      int sample = 1;
                      while (bounds.outWidth / sample > 1600 || bounds.outHeight / sample > 1600) sample *= 2;

                      BitmapFactory.Options opts = new BitmapFactory.Options();
                      opts.inSampleSize = sample;
                      InputStream is2 = getContentResolver().openInputStream(uri);
                      if (is2 == null) return null;
                      Bitmap bmp = BitmapFactory.decodeStream(is2, null, opts);
                      is2.close();
                      if (bmp == null) return null;

                      int degrees = 0;
                      try {
                          InputStream is3 = getContentResolver().openInputStream(uri);
                          if (is3 != null) {
                              android.media.ExifInterface exif = new android.media.ExifInterface(is3);
                              int o = exif.getAttributeInt(android.media.ExifInterface.TAG_ORIENTATION, android.media.ExifInterface.ORIENTATION_NORMAL);
                              is3.close();
                              if (o == android.media.ExifInterface.ORIENTATION_ROTATE_90) degrees = 90;
                              else if (o == android.media.ExifInterface.ORIENTATION_ROTATE_180) degrees = 180;
                              else if (o == android.media.ExifInterface.ORIENTATION_ROTATE_270) degrees = 270;
                          }
                      } catch (Throwable ignored) {}
                      if (degrees != 0) {
                          Matrix m = new Matrix();
                          m.postRotate(degrees);
                          Bitmap rotated = Bitmap.createBitmap(bmp, 0, 0, bmp.getWidth(), bmp.getHeight(), m, true);
                          bmp.recycle();
                          bmp = rotated;
                      }

                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      bmp.compress(Bitmap.CompressFormat.JPEG, 85, bos);
                      bmp.recycle();
                      return "data:image/jpeg;base64," + Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP);
                  } catch (Throwable t) {
                      return null;
                  }
              }
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  AuraSplash.show(this, this.bridge.getWebView());
                  WebSettings settings = this.bridge.getWebView().getSettings();
                settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  // Başka uygulamadan (galeri vb.) "Paylaş" ile gelen resimleri JS'e köprüle
                  this.bridge.getWebView().addJavascriptInterface(new ShareBridge(), "AuraShare");
                  handleShareIntent(getIntent());
                  handleCallIntent(getIntent());
                  this.bridge.getWebView().addJavascriptInterface(new CallBridge(), "AuraCall");
                  captureLaunchChat(getIntent());
                  addPendingCount(getIntent());
                  this.bridge.getWebView().addJavascriptInterface(new LaunchBridge(), "AuraLaunch");
                  this.bridge.getWebView().addJavascriptInterface(new ThemeBridge(), "AuraTheme");
                  this.bridge.getWebView().addJavascriptInterface(new NotifBridge(), "AuraNotif");
                  clearChatFromIntent(getIntent());
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          try {
                              MainActivity.this.bridge.getWebView().evaluateJavascript(
                                  "(function(){try{return window.__auraBackPress?window.__auraBackPress():false;}catch(e){return false;}})()",
                                  new ValueCallback<String>() {
                                      @Override
                                      public void onReceiveValue(String v) {
                                          if (!"true".equals(v)) moveTaskToBack(true);
                                      }
                                  });
                          } catch (Throwable t) {
                              moveTaskToBack(true);
                          }
                      }
                  });
                  // Galeriye kaydedilen resimleri yeniden kurulumdan sonra da okuyabilmek için medya izni iste
                  String mediaPerm = Build.VERSION.SDK_INT >= 33
                      ? Manifest.permission.READ_MEDIA_IMAGES
                      : Manifest.permission.READ_EXTERNAL_STORAGE;
                  if (ContextCompat.checkSelfPermission(this, mediaPerm) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{ mediaPerm }, 7001);
                  }
              }
          }
          EOF
            echo "MainActivity.java güncellendi."
          else
            echo "UYARI: MainActivity.java bulunamadı!"
          fi

      - name: AuraMessagingService.java - Kapalı uygulamada telefon çalar gibi gelen arama
        run: |
          MAIN_ACTIVITY=$(find android -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            SERVICE_FILE="$(dirname "$MAIN_ACTIVITY")/AuraMessagingService.java"
            cat > "$SERVICE_FILE" << 'EOF'
          package com.aurachat.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;                       import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import com.capacitorjs.plugins.pushnotifications.MessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.util.Map;

          // Kapalı ya da arka plandaki uygulamada gelen aramayı telefon çalar gibi gösterir:
          // zil sesi + titreşim + kilit ekranında tam ekran arama bildirimi.
          // Arama dışındaki bildirimler eskisi gibi Capacitor'ın servisine gider.
          public class AuraMessagingService extends MessagingService {
              public static final String CALL_CHANNEL_ID = "aurachat-calls";

              @Override
              public void onMessageReceived(RemoteMessage remoteMessage) {
                  Map<String, String> data = remoteMessage.getData();
                  if (data != null && "call".equals(data.get("kind"))) {
                      try {
                          showIncomingCall(data);
                      } catch (Exception e) {
                          super.onMessageReceived(remoteMessage);
                      }
                      return;
                  }
                  // Sunucu "sadece veri" yolladıysa bildirimi telefon kendi çizer: sohbet başına tek blok
                  if (data != null && remoteMessage.getNotification() == null && data.get("chatId") != null) {
                      // Uygulama ekrandaysa bildirim çıkmaz (eskisi gibi); sadece JS'e haber gider
                      if (MainActivity.inForeground) {
                          super.onMessageReceived(remoteMessage);
                          return;
                      }
                      String tg = data.get("tag");
                      if (tg != null && (tg.startsWith("call_") || tg.startsWith("gcall_"))) {
                          AuraNotif.showSimple(this, data);
                      } else {
                          AuraNotif.show(this, data);
                      }
                      return;
                  }
                  super.onMessageReceived(remoteMessage);
              }

              private void showIncomingCall(Map<String, String> data) {
                  // Uygulama ekrandaysa uygulamanın kendi "Gelen arama" ekranı çalışır
                  if (MainActivity.inForeground) return;

                  String chatId = data.get("chatId");
                  String tag = data.get("tag");
                  if (tag == null || tag.isEmpty()) tag = "call_" + chatId;
                  String title = data.get("title");
                  String body = data.get("body");
                  if (title == null || title.isEmpty()) title = "AuraChat";
                  if (body == null || body.isEmpty()) body = "Gelen arama";

                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  Uri ringtone = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                  long[] vibration = new long[]{0, 600, 400, 600, 400, 600};

                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(CALL_CHANNEL_ID, "Aramalar", NotificationManager.IMPORTANCE_HIGH);
                      channel.setDescription("Gelen sesli ve görüntülü aramalar");
                      channel.setSound(ringtone, new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build());
                      channel.enableVibration(true);
                      channel.setVibrationPattern(vibration);
                      channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      nm.createNotificationChannel(channel);
                  }

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  intent.putExtra("aura_call", true);
                  int piFlags = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0);
                  PendingIntent pi = PendingIntent.getActivity(this, 7100, intent, piFlags);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CALL_CHANNEL_ID)
                          .setSmallIcon(AuraNotif.smallIcon(this))
                          .setColor(AuraNotif.ACCENT)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setAutoCancel(true)
                          .setTimeoutAfter(45000)
                          .setContentIntent(pi)
                          .setFullScreenIntent(pi, true)
                          .setSound(ringtone, AudioManager.STREAM_RING)
                          .setVibrate(vibration);

                  Notification notification = builder.build();
                  // Bildirim kapanana kadar zil ve titreşim tekrar etsin
                  notification.flags |= Notification.FLAG_INSISTENT;
                  // Aynı tag: arayan vazgeçince gelen "Cevapsız arama" bildirimi bunun yerine geçer
                  nm.notify(tag, 0, notification);
              }
          }
