name: Build Android APK

on:
  workflow_dispatch:
  # Telefon tarafındaki kod bu dosyanın içinde olduğu için, yalnızca bu dosya değişince kendiliğinden derler.
  # (Saf JS/HTML değişiklikleri Vercel'den anında yayınlandığı için APK gerektirmez.)
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

# Aynı anda iki derleme çalışmasın; yenisi gelince eskisi iptal olur
concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoriyi Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Keystore Secret Var mı Kontrol Et
        id: checksecret
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Kayıtlı Keystore'u Secret'tan Yükle (SABİT SHA-1)
        if: steps.checksecret.outputs.exists == 'true'
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          echo "Kayıtlı keystore kullanılıyor, SHA-1 sabit kalacak."

      - name: Geçici Keystore Üret (secret henüz yok)
        if: steps.checksecret.outputs.exists == 'false'
        run: |
          echo "UYARI: ANDROID_KEYSTORE_BASE64 secret'ı henüz ayarlanmamış."
          rm -rf ~/.android/debug.keystore
          mkdir -p ~/.android
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12

      - name: Bağımlılıkları Yükle
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install --legacy-peer-deps \
            @capacitor/core@5.7.0 \
            @capacitor/cli@5.7.0 \
            @capacitor/android@5.7.0 \
            @capacitor/app@5.0.7 \
            @capacitor-community/contacts@5.0.5 \
            @codetrix-studio/capacitor-google-auth@3.3.0 \
            @capacitor/push-notifications@5.1.0 \
            @capacitor/camera@5.0.7 \
            @capacitor/filesystem@5.2.1 \
            @capacitor/share@5.0.7 \
            @capacitor/haptics@5.0.6

      - name: Web Dosyalarını Hazırla ve Konfigüre Et
        run: |
          # Tailwind CSS dosyası depoda yok (Vercel derlemede üretiyor): APK'ya girmeden önce burada üret
          npm install --no-save --legacy-peer-deps tailwindcss@3.4.17
          npx tailwindcss -c tailwind.config.js -i css/tailwind-input.css -o css/tailwind.css --minify
          ls -la css/tailwind.css
          rm -rf www
          mkdir -p www
          cp -r *.html *.js *.json *.css www/ 2>/dev/null || true
          cp -r js static assets css www/ 2>/dev/null || true
          # Web dosyaları APK'nın içinden açılır (Vercel'den indirme yok): <base href> Vercel'e yönlendirdiği için silinir
          sed -i '/<base href=/d' www/index.html
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.aurachat.app",
            "appName": "AuraChat",
            "webDir": "www",
            "bundledWebRuntime": false,
            "backgroundColor": "#000000",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "plugins": {
              "GoogleAuth": {
                "scopes": ["profile", "email"],
                "serverClientId": "447747395966-3shresouu36769er1b9656oec8vd13aa.apps.googleusercontent.com",
                "forceCodeForRefreshToken": true
              },
              "PushNotifications": {
                "presentationOptions": ["badge", "sound", "alert"]
              }
            }
          }
          EOF

      - name: Capacitor Android Ekle ve Senkronize Et
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: MainActivity.java - WebView Önbellek Ayarı Ekle
        run: |
          MAIN_ACTIVITY=$(find android -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            cat > "$MAIN_ACTIVITY" << 'EOF'
          package com.aurachat.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import android.webkit.WebSettings;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Matrix;
          import android.net.Uri;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.ArrayList;
          import org.json.JSONArray;
          import android.app.Notification;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.service.notification.StatusBarNotification;
          import android.view.WindowManager;
          import androidx.activity.OnBackPressedCallback;
          import android.webkit.ValueCallback;
          import org.json.JSONObject;
          import com.google.android.gms.auth.GoogleAuthUtil;
          import com.google.android.gms.auth.UserRecoverableAuthException;
          import com.google.android.gms.auth.api.signin.GoogleSignIn;
          import com.google.android.gms.auth.api.signin.GoogleSignInAccount;
          import com.google.android.gms.common.api.Scope;
          import java.io.File;
          import androidx.core.content.FileProvider;

          public class MainActivity extends BridgeActivity {
              // Uygulama ekranda mı? (AuraMessagingService, uygulama açıkken arama bildirimi göstermesin diye bakar)
              static volatile boolean inForeground = false;
              

              // JS, uygulamanın kendi "Gelen arama" ekranı açılınca telefonun arama bildirimini kapatır
              public class CallBridge {
                  @JavascriptInterface
                  public void cancelCallNotifications() {
                      clearCallNotifications();
                  }
              }

              @Override
              public void onStart() {
                  super.onStart();
                  inForeground = true;
              }

              @Override
              public void onStop() {
                  super.onStop();
                  inForeground = false;
                  // Kilit ekranının üstünde görünme izni sadece gelen arama içindi
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(false);
                      setTurnScreenOn(false);
                  }
              }

              // Gelen arama bildirimiyle (tam ekran ya da dokunarak) açıldıysa kilit ekranının üstünde göster
              private void handleCallIntent(Intent intent) {
                  if (intent == null || !intent.getBooleanExtra("aura_call", false)) return;
                  intent.removeExtra("aura_call");
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  } else {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                  }
              }

              private void clearCallNotifications() {
                  try {
                      if (Build.VERSION.SDK_INT < 26) return;
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      for (StatusBarNotification sbn : nm.getActiveNotifications()) {
                          Notification n = sbn.getNotification();
                          if (n != null && AuraMessagingService.CALL_CHANNEL_ID.equals(n.getChannelId())) {
                              nm.cancel(sbn.getTag(), sbn.getId());
                          }
                      }
                  } catch (Exception e) {}
              }

              private volatile String pendingSharedJson = null;
              private volatile boolean shareBusy = false;
                            private volatile String pendingShareTarget = "";
                                          private volatile String pendingShareDiag = "";
              private volatile String launchChatJson = "";

            // JS, sohbet temasının rengini bildirir; seçim tutamakları bu renge boyanır
              public class NotifBridge {
                  @JavascriptInterface
                  public void setSession(String uid, String refreshToken) {
                      AuraNotif.setSession(getApplicationContext(), uid, refreshToken);
                  }
                  @JavascriptInterface
                  public void clearSession() {
                      AuraNotif.clearSession(getApplicationContext());
                  }
                  @JavascriptInterface
                  public void clearChat(String chatId) {
                      AuraNotif.clearChat(getApplicationContext(), chatId);
                  }
                                    // Paylaş menüsünde son sohbetler kişi olarak çıksın (Direct Share)
                  @JavascriptInterface
                  public void publishShortcut(String chatId, String title, String avatarDataUrl) {
                      try {
                          Bitmap bmp = null;
                          if (avatarDataUrl != null && avatarDataUrl.indexOf(",") > 0) {
                              byte[] raw = android.util.Base64.decode(avatarDataUrl.substring(avatarDataUrl.indexOf(",") + 1), android.util.Base64.DEFAULT);
                              bmp = BitmapFactory.decodeByteArray(raw, 0, raw.length);
                              if (bmp != null && (bmp.getWidth() > 192 || bmp.getHeight() > 192)) {
                                  bmp = Bitmap.createScaledBitmap(bmp, 192, 192, true);
                              }
                          }
                          AuraNotif.publishShortcut(getApplicationContext(), "chat_" + chatId, title == null ? "" : title, bmp);
                      } catch (Throwable t) {}
                  }
              }
              public class GalleryBridge {
                  private final java.util.concurrent.ExecutorService pool = java.util.concurrent.Executors.newFixedThreadPool(3);

                  private String perm() {
                      return Build.VERSION.SDK_INT >= 33 ? Manifest.permission.READ_MEDIA_IMAGES : Manifest.permission.READ_EXTERNAL_STORAGE;
                  }

                  @JavascriptInterface
                  public boolean has() {
                      try {
                          if (ContextCompat.checkSelfPermission(MainActivity.this, perm()) == PackageManager.PERMISSION_GRANTED) return true;
                          if (Build.VERSION.SDK_INT >= 34 && ContextCompat.checkSelfPermission(MainActivity.this, "android.permission.READ_MEDIA_VISUAL_USER_SELECTED") == PackageManager.PERMISSION_GRANTED) return true;
                      } catch (Throwable t) {}
                      return false;
                  }

                  @JavascriptInterface
                  public void ask() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              ActivityCompat.requestPermissions(MainActivity.this, new String[]{ perm() }, 7001);
                          }
                      });
                  }

                  @JavascriptInterface
                  public String list(int offset, int limit) {
                      org.json.JSONArray arr = new org.json.JSONArray();
                      try {
                          android.net.Uri uri = android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                          String[] proj = new String[]{ android.provider.MediaStore.Images.Media._ID };
                          android.database.Cursor cur;
                          if (Build.VERSION.SDK_INT >= 26) {
                              android.os.Bundle b = new android.os.Bundle();
                              b.putInt(android.content.ContentResolver.QUERY_ARG_LIMIT, limit);
                              b.putInt(android.content.ContentResolver.QUERY_ARG_OFFSET, offset);
                              b.putStringArray(android.content.ContentResolver.QUERY_ARG_SORT_COLUMNS, new String[]{ "date_added" });
                              b.putInt(android.content.ContentResolver.QUERY_ARG_SORT_DIRECTION, android.content.ContentResolver.QUERY_SORT_DIRECTION_DESCENDING);
                              cur = getContentResolver().query(uri, proj, b, null);
                          } else {
                              cur = getContentResolver().query(uri, proj, null, null, "date_added DESC LIMIT " + limit + " OFFSET " + offset);
                          }
                          if (cur != null) {
                              while (cur.moveToNext()) arr.put(cur.getLong(0));
                              cur.close();
                          }
                      } catch (Throwable t) {}
                      return arr.toString();
                  }

                  private void deliver(final String js) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try { MainActivity.this.bridge.getWebView().evaluateJavascript(js, null); } catch (Throwable t) {}
                          }
                      });
                  }

                  @JavascriptInterface
                  public void thumbAsync(final long id, final int size) {
                      pool.execute(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  android.net.Uri uri = android.content.ContentUris.withAppendedId(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id);
                                  Bitmap bmp;
                                  if (Build.VERSION.SDK_INT >= 29) {
                                      bmp = getContentResolver().loadThumbnail(uri, new android.util.Size(size, size), null);
                                  } else {
                                      bmp = android.provider.MediaStore.Images.Thumbnails.getThumbnail(getContentResolver(), id, android.provider.MediaStore.Images.Thumbnails.MINI_KIND, null);
                                  }
                                  if (bmp == null) return;
                                  java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                                  bmp.compress(Bitmap.CompressFormat.JPEG, 72, bo);
                                  String b64 = android.util.Base64.encodeToString(bo.toByteArray(), android.util.Base64.NO_WRAP);
                                  deliver("window.__auraGalThumb&&window.__auraGalThumb(" + id + ",'data:image/jpeg;base64," + b64 + "')");
                              } catch (Throwable t) {}
                          }
                      });
                  }

                  @JavascriptInterface
                  public void fullAsync(final long id) {
                      pool.execute(new Runnable() {
                          @Override
                          public void run() {
                              String out = "";
                              try {
                                  android.net.Uri uri = android.content.ContentUris.withAppendedId(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id);
                                  android.graphics.BitmapFactory.Options o = new android.graphics.BitmapFactory.Options();
                                  o.inJustDecodeBounds = true;
                                  java.io.InputStream in1 = getContentResolver().openInputStream(uri);
                                  BitmapFactory.decodeStream(in1, null, o);
                                  if (in1 != null) in1.close();
                                  int sample = 1;
                                  while ((o.outWidth / sample) > 1800 || (o.outHeight / sample) > 1800) sample *= 2;
                                  android.graphics.BitmapFactory.Options o2 = new android.graphics.BitmapFactory.Options();
                                  o2.inSampleSize = sample;
                                  java.io.InputStream in2 = getContentResolver().openInputStream(uri);
                                  Bitmap bmp = BitmapFactory.decodeStream(in2, null, o2);
                                  if (in2 != null) in2.close();
                                  if (bmp != null) {
                                      int rot = 0;
                                      try {
                                          java.io.InputStream in3 = getContentResolver().openInputStream(uri);
                                          android.media.ExifInterface ex = new android.media.ExifInterface(in3);
                                          int ori = ex.getAttributeInt(android.media.ExifInterface.TAG_ORIENTATION, 1);
                                          if (ori == 6) rot = 90; else if (ori == 3) rot = 180; else if (ori == 8) rot = 270;
                                          if (in3 != null) in3.close();
                                      } catch (Throwable t) {}
                                      if (rot != 0) {
                                          android.graphics.Matrix m = new android.graphics.Matrix();
                                          m.postRotate(rot);
                                          bmp = Bitmap.createBitmap(bmp, 0, 0, bmp.getWidth(), bmp.getHeight(), m, true);
                                      }
                                      java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                                      bmp.compress(Bitmap.CompressFormat.JPEG, 85, bo);
                                      out = "data:image/jpeg;base64," + android.util.Base64.encodeToString(bo.toByteArray(), android.util.Base64.NO_WRAP);
                                  }
                              } catch (Throwable t) {}
                              deliver("window.__auraGalFull&&window.__auraGalFull(" + id + ",'" + out + "')");
                          }
                      });
                  }
              }

              public class ContactBridge {
                  @JavascriptInterface
                  public void add(final String name, final String phone) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  Intent i = new Intent(android.provider.ContactsContract.Intents.Insert.ACTION);
                                  i.setType(android.provider.ContactsContract.RawContacts.CONTENT_TYPE);
                                  i.putExtra(android.provider.ContactsContract.Intents.Insert.NAME, name);
                                  i.putExtra(android.provider.ContactsContract.Intents.Insert.PHONE, phone);
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(i);
                              } catch (Throwable t) {}
                          }
                      });
                  }
              }



              // Drive yedeği: izin SADECE yedekle/geri yükle'ye basılınca istenir
              static final int DRIVE_REQ = 9101;
              static final int DRIVE_REQ_RETRY = 9102;
              static final String DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";

              void driveResult(final String token, final String err) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              String js = "window.__auraDriveCb&&window.__auraDriveCb("
                                  + JSONObject.quote(token == null ? "" : token) + ","
                                  + JSONObject.quote(err == null ? "" : err) + ")";
                              MainActivity.this.bridge.getWebView().evaluateJavascript(js, null);
                          } catch (Throwable t) {}
                      }
                  });
              }

              void fetchDriveToken(final GoogleSignInAccount acct) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              String token = GoogleAuthUtil.getToken(MainActivity.this, acct.getAccount(), "oauth2:" + DRIVE_SCOPE);
                              driveResult(token, null);
                          } catch (final UserRecoverableAuthException e) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      try { startActivityForResult(e.getIntent(), DRIVE_REQ_RETRY); }
                                      catch (Throwable t) { driveResult(null, "Drive izni açılamadı."); }
                                  }
                              });
                          } catch (Throwable t) {
                              driveResult(null, "Drive izni alınamadı: " + t.getMessage());
                          }
                      }
                  }).start();
              }

              public class DriveBridge {
                  @JavascriptInterface
                  public void requestToken() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  GoogleSignInAccount acct = GoogleSignIn.getLastSignedInAccount(MainActivity.this);
                                  if (acct == null || acct.getAccount() == null) {
                                      driveResult(null, "Google hesabı bulunamadı. Çıkış yapıp Google ile tekrar giriş yap.");
                                      return;
                                  }
                                  Scope sc = new Scope(DRIVE_SCOPE);
                                  if (GoogleSignIn.hasPermissions(acct, sc)) {
                                      fetchDriveToken(acct);
                                  } else {
                                      GoogleSignIn.requestPermissions(MainActivity.this, DRIVE_REQ, acct, sc);
                                  }
                              } catch (Throwable t) {
                                  driveResult(null, "Drive izni hatası: " + t.getMessage());
                              }
                          }
                      });
                  }
              }

              @Override
              public void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == DRIVE_REQ || requestCode == DRIVE_REQ_RETRY) {
                      if (resultCode == RESULT_OK) {
                          GoogleSignInAccount acct = GoogleSignIn.getLastSignedInAccount(this);
                          if (acct != null && acct.getAccount() != null) fetchDriveToken(acct);
                          else driveResult(null, "Google hesabı bulunamadı.");
                      } else {
                          driveResult(null, "Drive izni verilmedi.");
                      }
                  }
              }

              // Bir kez görülen fotoğraf açıkken ekran görüntüsü / ekran kaydı engellenir (FLAG_SECURE)
              public class SecureBridge {
                  @JavascriptInterface
                  public void set(final boolean on) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);
                                  else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
                              } catch (Throwable t) {}
                          }
                      });
                  }
              }

              // Kaydedilen belgeyi (PDF, Word...) telefondaki uygun uygulamada açar
              public class DocBridge {
                  @JavascriptInterface
                  public boolean open(final String path, final String mime) {
                      try {
                          final File f = new File(path == null ? "" : path);
                          if (!f.exists()) return false;
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      Uri uri = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".fileprovider", f);
                                      Intent i = new Intent(Intent.ACTION_VIEW);
                                      i.setDataAndType(uri, (mime == null || mime.length() == 0) ? "*/*" : mime);
                                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                                      startActivity(i);
                                  } catch (Throwable t) {
                                      android.widget.Toast.makeText(MainActivity.this, "Bu belgeyi açacak uygulama bulunamadı", android.widget.Toast.LENGTH_LONG).show();
                                  }
                              }
                          });
                          return true;
                      } catch (Throwable t) {
                          return false;
                      }
                  }
              }

              // Uygulama ikonunu değiştirir (activity-alias aç/kapat): 0 = varsayılan, 1..15 = seçenekler.
              // Çalışan uygulamanın kendi giriş noktası kapatılınca Android uygulamayı kapattığı için
              // değişiklik hemen değil, kullanıcı uygulamadan çıkarken (ana ekran / geri) uygulanır.
              static volatile int pendingIcon = -1;

              String iconAliasName(int n) {
                  return "com.aurachat.app." + (n == 0 ? "IconDefault" : "IconAlt" + n);
              }

              void applyPendingIcon() {
                  final int target = pendingIcon;
                  if (target < 0) return;
                  pendingIcon = -1;
                  try {
                      android.content.pm.PackageManager pm = getPackageManager();
                      pm.setComponentEnabledSetting(new android.content.ComponentName(getPackageName(), iconAliasName(target)),
                          android.content.pm.PackageManager.COMPONENT_ENABLED_STATE_ENABLED,
                          android.content.pm.PackageManager.DONT_KILL_APP);
                      for (int n = 0; n <= 15; n++) {
                          if (n == target) continue;
                          try {
                              pm.setComponentEnabledSetting(new android.content.ComponentName(getPackageName(), iconAliasName(n)),
                                  android.content.pm.PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                                  android.content.pm.PackageManager.DONT_KILL_APP);
                          } catch (Throwable t) {}
                      }
                  } catch (Throwable t) {}
              }

              @Override
              protected void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  applyPendingIcon();
              }

              // "Şimdi değiştir": ikonu hemen uygular ve uygulamayı yeniden açar.
              // Süreç kapanırsa diye bir alarm da kurulur (süreç yaşıyorsa alarm iptal edilir, doğrudan yeniden açılır).
              void applyIconNowAndRestart() {
                  final int target = pendingIcon;
                  if (target < 0) return;
                  final android.content.Intent relaunch = new android.content.Intent(android.content.Intent.ACTION_MAIN);
                  relaunch.addCategory(android.content.Intent.CATEGORY_LAUNCHER);
                  relaunch.setComponent(new android.content.ComponentName(getPackageName(), iconAliasName(target)));
                  relaunch.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK | android.content.Intent.FLAG_ACTIVITY_CLEAR_TASK);
                  int imm = android.os.Build.VERSION.SDK_INT >= 23 ? android.app.PendingIntent.FLAG_IMMUTABLE : 0;
                  final android.app.PendingIntent pi = android.app.PendingIntent.getActivity(this, 9301, relaunch, android.app.PendingIntent.FLAG_CANCEL_CURRENT | imm);
                  final android.app.AlarmManager am = (android.app.AlarmManager) getSystemService(android.content.Context.ALARM_SERVICE);
                  try {
                      if (am != null) am.set(android.app.AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + 2000, pi);
                  } catch (Throwable t) {}
                  applyPendingIcon();
                  new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          try { if (am != null) am.cancel(pi); } catch (Throwable t) {}
                          try { startActivity(relaunch); } catch (Throwable t) {}
                      }
                  }, 600);
              }

              public class IconBridge {
                  @JavascriptInterface
                  public int current() {
                      if (pendingIcon >= 0) return pendingIcon;
                      try {
                          android.content.pm.PackageManager pm = getPackageManager();
                          for (int n = 0; n <= 15; n++) {
                              int st;
                              try {
                                  st = pm.getComponentEnabledSetting(new android.content.ComponentName(getPackageName(), iconAliasName(n)));
                              } catch (Throwable t) { continue; }
                              boolean on = st == android.content.pm.PackageManager.COMPONENT_ENABLED_STATE_ENABLED
                                  || (st == android.content.pm.PackageManager.COMPONENT_ENABLED_STATE_DEFAULT && n == 0);
                              if (on) return n;
                          }
                      } catch (Throwable t) {}
                      return 0;
                  }
