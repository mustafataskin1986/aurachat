              for n in 0 1 2 3 4 5; do
                ALIASES="$ALIASES    <activity-alias android:name=\".ShareSlot$n\" android:targetActivity=\".MainActivity\" android:exported=\"true\" android:label=\"AuraChat\" />\n"
