name: Eski APK Çıktılarını Temizle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  actions: write

jobs:
  temizle:
    runs-on: ubuntu-latest
    steps:
      - name: Tüm çıktıları sil
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Silinecek çıktılar listeleniyor..."
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' > ids.txt
          echo "Toplam: $(wc -l < ids.txt)"
          ok=0
          fail=0
          while read id; do
            if gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" > /dev/null; then
              ok=$((ok+1))
            else
              fail=$((fail+1))
              echo "SILINEMEDI: $id"
            fi
          done < ids.txt
          echo "Silinen: $ok, silinemeyen: $fail"
          if [ "$fail" -gt 0 ]; then exit 1; fi