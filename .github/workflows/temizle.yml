name: Eski APK Çıktılarını Temizle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  actions: write

jobs:
  temizle:
    runs-on: ubuntu-latest
    steps:
      - name: Çıktıları sil
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' > art.txt
          echo "Çıktı sayısı: $(wc -l < art.txt)"
          while read id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" > /dev/null || echo "SILINEMEDI: $id"
          done < art.txt

      - name: Eski çalıştırma kayıtlarını sil (son 3 kalsın)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status=="completed") | .id' \
            | grep -v "^${{ github.run_id }}$" | tail -n +4 > runs.txt
          echo "Silinecek kayıt: $(wc -l < runs.txt)"
          ok=0
          fail=0
          while read id; do
            if gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" > /dev/null; then
              ok=$((ok+1))
            else
              fail=$((fail+1))
              echo "SILINEMEDI: $id"
            fi
          done < runs.txt
          echo "Silinen: $ok, silinemeyen: $fail"