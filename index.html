<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraChat - WhatsApp Web</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b141a; }
        ::-webkit-scrollbar-thumb { background: #202c33; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#050b14] h-[100dvh] w-screen overflow-hidden font-sans flex items-center justify-center p-0 md:p-4">

    <!-- GİRİŞ EKRANI (OVERLAY) -->
    <div id="login-overlay" class="fixed inset-0 z-50 bg-[#0b141a] flex items-center justify-center p-4 hidden">
        <div class="bg-[#111b21] border border-gray-800 rounded-2xl p-6 md:p-8 w-full max-w-md shadow-2xl text-center">
            <div class="w-16 h-16 bg-gradient-to-tr from-cyan-600 to-emerald-500 rounded-full flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4 shadow-lg">
                <i class="fa-solid fa-comments"></i>
            </div>
            <h2 class="text-white text-xl font-bold mb-1">AuraChat'e Hoş Geldin</h2>
            <p class="text-gray-400 text-sm mb-6">Güvenli sohbet için adını ve şifreni gir kanka.</p>

            <form id="login-form" class="space-y-4 text-left">
                <div class="flex flex-col items-center">
                    <label for="profile-image-input" class="cursor-pointer group relative">
                        <div id="profile-preview" class="w-20 h-20 bg-[#202c33] border-2 border-dashed border-gray-600 rounded-full flex items-center justify-center text-gray-400 overflow-hidden group-hover:border-emerald-500 transition shadow-inner">
                            <i class="fa-solid fa-camera text-xl"></i>
                        </div>
                        <div class="absolute bottom-0 right-0 bg-emerald-600 text-white w-6 h-6 rounded-full flex items-center text-xs justify-center shadow">
                            <i class="fa-solid fa-plus"></i>
                        </div>
                    </label>
                    <input type="file" id="profile-image-input" accept="image/*" class="hidden">
                    <span class="text-xs text-gray-400 mt-2">Profil Fotoğrafı Ekle (İsteğe bağlı)</span>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Adın veya Rumuzun</label>
                    <input type="text" id="username-input" autocomplete="off" placeholder="Örn: Hasan" required class="w-full bg-[#202c33] text-white text-sm px-4 py-3 rounded-xl border border-transparent focus:border-emerald-500/50 focus:outline-none transition placeholder-gray-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Şifren</label>
                    <input type="password" id="password-input" autocomplete="current-password" placeholder="Örn: 123456" required class="w-full bg-[#202c33] text-white text-sm px-4 py-3 rounded-xl border border-transparent focus:border-emerald-500/50 focus:outline-none transition placeholder-gray-500">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition shadow-lg flex items-center justify-center space-x-2 mt-2">
                    <span>Sohbete Başla</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Ana Konteyner -->
    <div class="bg-[#111b21] w-full max-w-6xl h-full md:h-[92vh] flex shadow-2xl rounded-none md:rounded-2xl overflow-hidden border border-gray-800/80 relative">
        
        <!-- SOL TARAF: Sohbet ve Kişi Listesi -->
        <div id="sidebar" class="w-full md:w-[38%] bg-[#111b21] border-r border-gray-800 flex flex-col h-full absolute md:relative inset-y-0 left-0 z-20 transition-transform duration-300">
            <div class="bg-[#202c33] px-4 py-3 flex justify-between items-center border-b border-gray-800 flex-shrink-0">
                <div class="flex items-center space-x-3">
                    <div id="user-profile-container" class="cursor-pointer">
                        <div class="w-10 h-10 bg-gradient-to-tr from-cyan-600 to-emerald-500 rounded-full flex items-center text-white font-semibold shadow justify-center">AC</div>
                    </div>
                    <span id="user-name-span" class="text-gray-100 font-semibold tracking-wide text-sm">AuraChat</span>
                </div>
                <div class="flex space-x-4 text-gray-400 text-lg">
                    <i class="fa-solid fa-circle-notch cursor-pointer hover:text-white transition"></i>
                    <i class="fa-solid fa-comment-alt cursor-pointer hover:text-white transition"></i>
                    <i class="fa-solid fa-ellipsis-vertical cursor-pointer hover:text-white transition" id="logout-btn" title="Çıkış Yap"></i>
                </div>
            </div>

            <!-- Arama Kutusu -->
            <div class="p-2.5 bg-[#111b21] flex-shrink-0">
                <div class="bg-[#202c33] flex items-center px-3 py-2 rounded-xl border border-transparent focus-within:border-emerald-500/50 transition">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm mr-3"></i>
                    <input type="text" id="search-contact" placeholder="Kişilerde veya odalarda ara..." class="bg-transparent w-full text-sm text-white focus:outline-none placeholder-gray-400">
                </div>
            </div>

            <!-- Liste -->
            <div id="contact-list" class="flex-1 overflow-y-auto divide-y divide-gray-800/40"></div>

            <div class="bg-[#202c33] border-t border-gray-800 py-2.5 px-6 flex justify-between items-center text-gray-400 flex-shrink-0">
                <div class="flex flex-col items-center cursor-pointer text-emerald-500 transition">
                    <i class="fa-solid fa-comment-dots text-lg"></i>
                    <span class="text-[10px] mt-0.5 font-medium">Sohbetler</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer hover:text-white transition">
                    <i class="fa-solid fa-circle-notch text-lg"></i>
                    <span class="text-[10px] mt-0.5">Durum</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer hover:text-white transition">
                    <i class="fa-solid fa-users text-lg"></i>
                    <span class="text-[10px] mt-0.5">Kişiler</span>
                </div>
            </div>
        </div>

        <!-- SAĞ TARAF: Aktif Mesajlaşma Ekranı -->
        <div id="chat-area" class="w-full md:flex-1 flex flex-col bg-[#0b141a] absolute md:relative inset-y-0 right-0 z-30 translate-x-full md:translate-x-0 transition-transform duration-300 h-full">
            <!-- Sohbet Üst Barı -->
            <div class="bg-[#202c33] px-4 py-3 flex justify-between items-center border-b border-gray-800 flex-shrink-0">
                <div class="flex items-center space-x-3">
                    <button id="back-btn" class="md:hidden text-gray-400 mr-1 hover:text-white transition text-lg px-1 py-0.5">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div id="active-chat-avatar" class="w-10 h-10 bg-gradient-to-tr from-emerald-600 to-cyan-600 rounded-full flex items-center text-white font-bold justify-center shadow flex-shrink-0">
                        <i class="fa-solid fa-globe text-sm"></i>
                    </div>
                    <div>
                        <h4 id="active-chat-name" class="text-white font-medium text-sm md:text-base">Genel Kanka Odası 🌍</h4>
                        <span id="active-chat-status" class="text-[11px] text-emerald-400 font-medium">Çevrimiçi</span>
                    </div>
                </div>
                <div class="flex space-x-5 text-gray-400 text-lg">
                    <i class="fa-solid fa-video cursor-pointer hover:text-white transition"></i>
                    <i class="fa-solid fa-paperclip cursor-pointer hover:text-white transition"></i>
                    <i class="fa-solid fa-ellipsis-vertical cursor-pointer hover:text-white transition"></i>
                </div>
            </div>

            <!-- Mesajların Akış Alanı -->
            <div id="message-container" class="flex-1 min-h-0 p-4 md:p-6 overflow-y-auto space-y-4 bg-[url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')] bg-repeat opacity-95"></div>

            <!-- Mesaj Yazma Paneli -->
            <div class="bg-[#202c33] px-3 md:px-4 py-3 flex items-center space-x-3 border-t border-gray-800 flex-shrink-0">
                <i class="fa-regular fa-face-smile text-gray-400 text-xl cursor-pointer hover:text-white transition"></i>
                <i class="fa-solid fa-plus text-gray-400 text-xl cursor-pointer hover:text-white transition"></i>
                <input type="text" id="message-input" autocomplete="off" placeholder="Bir mesaj yazın..." class="bg-[#2a3942] text-white px-4 py-2.5 rounded-xl flex-1 text-sm focus:outline-none placeholder-gray-400 border border-transparent focus:border-emerald-500/50 transition">
                <button id="send-btn" class="bg-emerald-600 text-white w-10 h-10 rounded-xl flex items-center justify-center hover:bg-emerald-500 transition shadow flex-shrink-0">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- FIREBASE VE WHATSAPP MANTIĞI -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTOmajjZsfnikrJLM1UVmXMlUobFNyJGs",
            authDomain: "aurachat-99f69.firebaseapp.com",
            projectId: "aurachat-99f69",
            storageBucket: "aurachat-99f69.firebasestorage.app",
            messagingSenderId: "447747395966",
            appId: "1:447747395966:web:7db71f9f912a188d17632f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginOverlay = document.getElementById('login-overlay');
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const profileImageInput = document.getElementById('profile-image-input');
        const profilePreview = document.getElementById('profile-preview');
        const messageContainer = document.getElementById('message-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const userProfileContainer = document.getElementById('user-profile-container');
        const userNameSpan = document.getElementById('user-name-span');
        const contactList = document.getElementById('contact-list');
        const sidebar = document.getElementById('sidebar');
        const chatArea = document.getElementById('chat-area');
        const backBtn = document.getElementById('back-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const activeChatName = document.getElementById('active-chat-name');
        const activeChatAvatar = document.getElementById('active-chat-avatar');
        const activeChatStatus = document.getElementById('active-chat-status');
        const searchContact = document.getElementById('search-contact');

        let base64Image = '';
        let currentUser = JSON.parse(localStorage.getItem('aurachat_user'));
        let currentChatId = 'global';
        let currentChatName = 'Genel Kanka Odası 🌍';
        let unsubscribeMessages = null;

        if (currentUser) {
            loginOverlay.classList.add('hidden');
            updateUserInterface(currentUser);
            initApp();
        } else {
            loginOverlay.classList.remove('hidden');
        }

        profileImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    base64Image = uploadEvent.target.result;
                    profilePreview.innerHTML = `<img src="${base64Image}" class="w-full h-full object-cover rounded-full">`;
                };
                reader.readAsDataURL(file);
            }
        });

        // ŞİFRELİ GİRİŞ VE KAYIT MANTIĞI
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            if (!username || !password) return;

            const userRef = doc(db, "users", username);
            const userSnap = await getDoc(userRef);

            let finalAvatar = base64Image;

            if (userSnap.exists()) {
                const userData = userSnap.data();
                // Şifre kontrolü
                if (userData.password && userData.password !== password) {
                    alert("Şifre hatalı kanka! Bu isim başka bir şifreyle kayıtlı.");
                    return;
                }
                // Eğer yeni fotoğraf seçmediyse eskisini koru
                if (!finalAvatar && userData.avatar) {
                    finalAvatar = userData.avatar;
                }
            }

            // Kullanıcıyı veritabanına kaydet / güncelle
            await setDoc(userRef, {
                name: username,
                password: password,
                avatar: finalAvatar || '',
                lastSeen: serverTimestamp()
            }, { merge: true });

            currentUser = {
                name: username,
                avatar: finalAvatar || ''
            };

            localStorage.setItem('aurachat_user', JSON.stringify(currentUser));
            loginOverlay.classList.add('hidden');
            updateUserInterface(currentUser);
            initApp();
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('aurachat_user');
            location.reload();
        });

        function updateUserInterface(user) {
            if (userProfileContainer) {
                if (user.avatar) {
                    userProfileContainer.innerHTML = `<img src="${user.avatar}" class="w-10 h-10 rounded-full object-cover shadow border border-emerald-500/50">`;
                } else {
                    const initials = user.name.substring(0, 2).toUpperCase();
                    userProfileContainer.innerHTML = `<div class="w-10 h-10 bg-gradient-to-tr from-cyan-600 to-emerald-500 rounded-full flex items-center justify-center text-white font-semibold shadow">${initials}</div>`;
                }
            }
            if (userNameSpan) userNameSpan.textContent = user.name;
        }

        function initApp() {
            loadContacts();
            loadMessages('global');
        }

        // Kişi Listesini Doldurma ve Kendi Adını Filtreleme
        function loadContacts() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                contactList.innerHTML = '';

                // 1. Genel Oda Butonu
                const globalDiv = document.createElement('div');
                globalDiv.className = "flex items-center px-4 py-3 bg-[#202c33]/40 hover:bg-[#202c33] cursor-pointer transition border-b border-gray-800/30";
                globalDiv.innerHTML = `
                    <div class="w-12 h-12 bg-gradient-to-tr from-emerald-600 to-cyan-600 rounded-full flex items-center text-white font-bold justify-center mr-3 shadow flex-shrink-0">
                        <i class="fa-solid fa-globe"></i>
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <h4 class="text-white font-medium text-sm">Genel Kanka Odası 🌍</h4>
                        <p class="text-xs text-emerald-400 truncate mt-0.5">Ortak sohbet alanı</p>
                    </div>
                `;
                globalDiv.addEventListener('click', () => {
                    selectChat('global', 'Genel Kanka Odası 🌍', 'global');
                });
                contactList.appendChild(globalDiv);

                const seenNames = new Set();
                const myNameClean = currentUser ? currentUser.name.trim().toLowerCase() : '';

                // 2. Diğer Kullanıcılar
                snapshot.forEach((docSnap) => {
                    const user = docSnap.data();
                    if (!user || !user.name) return;
                    
                    const targetNameClean = user.name.trim().toLowerCase();
                    if (targetNameClean === myNameClean) return; // Kendini listede gösterme
                    if (seenNames.has(targetNameClean)) return;  // Mükerrer engelle
                    seenNames.add(targetNameClean);

                    const chatId = [currentUser.name, user.name].sort().join('_');

                    const userDiv = document.createElement('div');
                    userDiv.className = "flex items-center px-4 py-3 hover:bg-[#202c33]/60 cursor-pointer transition border-b border-gray-800/30";
                    
                    let avatarContent = `<div class="w-12 h-12 bg-cyan-600 rounded-full flex items-center justify-center text-white font-bold shadow flex-shrink-0">${user.name.substring(0,2).toUpperCase()}</div>`;
                    if (user.avatar) {
                        avatarContent = `<img src="${user.avatar}" class="w-12 h-12 rounded-full object-cover shadow flex-shrink-0">`;
                    }

                    userDiv.innerHTML = `
                        ${avatarContent}
                        <div class="flex-1 overflow-hidden ml-3">
                            <div class="flex justify-between items-baseline">
                                <h4 class="text-white font-medium text-sm">${escapeHtml(user.name)}</h4>
                                <span class="text-[10px] text-emerald-400">Çevrimiçi</span>
                            </div>
                            <p class="text-xs text-gray-400 truncate mt-0.5">Özel mesaj göndermek için tıkla</p>
                        </div>
                    `;

                    userDiv.addEventListener('click', () => {
                        selectChat(chatId, user.name, user.avatar || '');
                    });

                    contactList.appendChild(userDiv);
                });
            });
        }

        function selectChat(chatId, name, avatar) {
            currentChatId = chatId;
            currentChatName = name;
            activeChatName.textContent = name;

            if (chatId === 'global') {
                activeChatAvatar.innerHTML = `<i class="fa-solid fa-globe text-sm"></i>`;
                activeChatStatus.textContent = "Herkes çevrimiçi";
            } else {
                if (avatar && avatar.startsWith('data:image')) {
                    activeChatAvatar.innerHTML = `<img src="${avatar}" class="w-full h-full rounded-full object-cover">`;
                } else {
                    activeChatAvatar.innerHTML = `<span class="text-sm font-bold">${name.substring(0,2).toUpperCase()}</span>`;
                }
                activeChatStatus.textContent = "Özel Sohbet";
            }

            // Mobilde sidebar gizle, sohbet alanını aç
            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                chatArea.classList.remove('translate-x-full');
            }

            loadMessages(chatId);
        }

        backBtn.addEventListener('click', () => {
            if (window.innerWidth < 768) {
                sidebar.classList.remove('-translate-x-full');
                chatArea.classList.add('translate-x-full');
            }
        });

        function loadMessages(chatId) {
            if (unsubscribeMessages) unsubscribeMessages();

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                messageContainer.innerHTML = '';
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    renderMessage(msg);
                });
                messageContainer.scrollTop = messageContainer.scrollHeight;
            }, (error) => {
                console.error("Mesajlar yüklenirken hata:", error);
            });
        }

        function renderMessage(msg) {
            const isMe = currentUser && msg.senderName === currentUser.name;
            const msgDiv = document.createElement('div');
            const timeStr = msg.createdAt ? new Date(msg.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Şimdi';

            if (isMe) {
                msgDiv.className = "flex justify-end";
                msgDiv.innerHTML = `
                    <div class="bg-[#005c4b] text-white px-4 py-2 rounded-xl max-w-[80%] md:max-w-md text-sm shadow relative">
                        <p class="text-[11px] text-emerald-200 font-semibold mb-0.5">Sen</p>
                        <p>${escapeHtml(msg.text)}</p>
                        <div class="flex items-center justify-end space-x-1 mt-1">
                            <span class="text-[10px] text-emerald-200">${timeStr}</span>
                            <i class="fa-solid fa-check-double text-[10px] text-cyan-300"></i>
                        </div>
                    </div>
                `;
            } else {
                msgDiv.className = "flex justify-start items-end space-x-2";
                let avatarHtml = `<div class="w-8 h-8 bg-cyan-600 rounded-full flex items-center justify-center text-white text-xs font-bold shadow flex-shrink-0">${msg.senderName.substring(0,2).toUpperCase()}</div>`;
                if (msg.senderAvatar) {
                    avatarHtml = `<img src="${msg.senderAvatar}" class="w-8 h-8 rounded-full object-cover shadow flex-shrink-0">`;
                }

                msgDiv.innerHTML = `
                    ${avatarHtml}
                    <div class="bg-[#202c33] text-gray-100 px-4 py-2 rounded-xl max-w-[80%] md:max-w-md text-sm shadow relative">
                        <p class="text-[11px] text-emerald-400 font-semibold mb-0.5">${escapeHtml(msg.senderName)}</p>
                        <p>${escapeHtml(msg.text)}</p>
                        <span class="text-[10px] text-gray-400 float-right ml-3 mt-1">${timeStr}</span>
                    </div>
                `;
            }
            messageContainer.appendChild(msgDiv);
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            try {
                await addDoc(collection(db, "chats", currentChatId, "messages"), {
                    text: text,
                    senderName: currentUser.name,
                    senderAvatar: currentUser.avatar || '',
                    createdAt: serverTimestamp()
                });
                messageInput.value = '';
            } catch (e) {
                console.error("Mesaj gönderilemedi: ", e);
                alert("Mesaj gönderilirken hata oluştu!");
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        searchContact.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const items = contactList.children;
            for (let item of items) {
                const text = item.textContent.toLowerCase();
                if (text.includes(term)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
