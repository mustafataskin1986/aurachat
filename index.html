<!DOCTYPE html>
<html lang="tr">
<head>
    <base href="https://aurachat-amber.vercel.app">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AuraChat - WhatsApp Web</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b141a; }
        ::-webkit-scrollbar-thumb { background: #202c33; border-radius: 4px; }

</head>
<body class="bg-[#050b14] w-screen font-sans flex items-center justify-center p-0 md:p-4">

    <!-- GİRİŞ EKRANI (OVERLAY - 2 ADIMLI MODAL) -->
    <div id="login-overlay" class="fixed inset-0 z-50 bg-[#0b141a] flex items-center justify-center p-4 hidden">
        <div class="bg-[#111b21] border border-gray-800 rounded-2xl p-6 md:p-8 w-full max-w-md shadow-2xl text-center relative">
            
            <div class="w-16 h-16 bg-gradient-to-tr from-cyan-600 to-emerald-500 rounded-full flex items-center justify-center text-white text-2xl font-bold mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-comments"></i>
            </div>
            <h2 class="text-white text-xl font-bold mb-1">AuraChat'e Hoş Geldin</h2>
            <p id="step-subtitle" class="text-gray-400 text-xs mb-5">Giriş yapmak için bilgilerinizi girin kanka.</p>

            <form id="login-form" class="space-y-4 text-left" autocomplete="off">
                
                <!-- 1. ADIM: E-POSTA VE ŞİFRE -->
                <div id="step-1" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">E-posta Adresin</label>
                        <textarea id="email-input" rows="1" name="aurachat_email_field" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-form-type="other" placeholder="Örn: ahmet@gmail.com" class="w-full bg-[#202c33] text-white text-sm px-4 py-3 rounded-xl border border-transparent focus:border-emerald-500/50 focus:outline-none transition placeholder-gray-500 resize-none overflow-hidden leading-tight" style="height:46px; max-height:46px;" oninput="this.value = this.value.replace(/\n/g, '');"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">Şifren</label>
                        <textarea id="password-input" rows="1" name="aurachat_pwd_field" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-form-type="other" placeholder="Örn: 123456" class="w-full bg-[#202c33] text-white text-sm px-4 py-3 rounded-xl border border-transparent focus:border-emerald-500/50 focus:outline-none transition placeholder-gray-500 resize-none overflow-hidden leading-tight" style="height:46px; max-height:46px; -webkit-text-security: disk;" oninput="this.value = this.value.replace(/\n/g, '');"></textarea>
                    </div>

                    <button type="button" id="btn-step-1-next" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition shadow-lg flex items-center justify-center space-x-2 mt-4">
                        <span>Devam Et</span>
                        <i class="fa-solid fa-arrow-right text-sm"></i>
                    </button>
                </div>

                <!-- 2. ADIM: KULLANICI ADI, TELEFON VE AVATAR (YALNIZCA YENİ KAYIT) -->
                <div id="step-2" class="space-y-4 hidden">
                    <div class="flex flex-col items-center my-2">
                        <label for="profile-image-input" class="cursor-pointer group relative">
                            <div id="profile-preview" class="w-24 h-24 bg-[#202c33] border-2 border-dashed border-gray-600 rounded-full flex items-center justify-center text-gray-400 overflow-hidden group-hover:border-emerald-500 transition shadow-inner">
                                <i class="fa-solid fa-camera text-2xl"></i>
                            </div>
                            <div class="absolute bottom-1 right-1 bg-emerald-600 text-white w-7 h-7 rounded-full flex items-center text-xs justify-center shadow-md">
                                <i class="fa-solid fa-plus"></i>
                            </div>
                        </label>
                        <input type="file" id="profile-image-input" accept="image/*" class="hidden">
                        <span class="text-xs text-gray-400 mt-2">Profil Fotoğrafı Ekle (İsteğe bağlı)</span>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">Adın veya Rumuzun</label>
                        <textarea id="username-input" rows="1" name="aurachat_usr_field" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-form-type="other" placeholder="Örn: Hasan" class="w-full bg-[#202c33] text-white text-sm px-4 py-3 rounded-xl border border-transparent focus:border-emerald-500/50 focus:outline-none transition placeholder-gray-500 resize-none overflow-hidden leading-tight" style="height:46px; max-height:46px;" oninput="this.value = this.value.replace(/\n/g, '');"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">Telefon Numaran</label>
                        <textarea id="phone-input" rows="1" name="aurachat_phone_field" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-form-type="other" placeholder="Örn: 05551234567" class="w-full bg-[#202c33] text-white text-sm px-4 py-3 rounded-xl border border-transparent focus:border-emerald-500/50 focus:outline-none transition placeholder-gray-500 resize-none overflow-hidden leading-tight" style="height:46px; max-height:46px;" oninput="this.value = this.value.replace(/\D/g, '');" maxlength="11"></textarea>
                    </div>

                    <div class="flex items-center space-x-2 pt-2">
                        <button type="button" id="btn-step-2-back" class="w-1/3 bg-[#202c33] hover:bg-gray-700 text-gray-300 font-medium py-3 rounded-xl transition flex items-center justify-center space-x-1 text-sm">
                            <i class="fa-solid fa-arrow-left text-xs"></i>
                            <span>Geri</span>
                        </button>
                        <button type="submit" id="btn-step-2-submit" class="w-2/3 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
                            <span>Kayıt Ol ve Başla</span>
                            <i class="fa-solid fa-check text-sm"></i>
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <!-- Ana Konteyner -->
    <div class="bg-[#111b21] w-full max-w-6xl h-full md:h-[92vh] flex shadow-2xl rounded-none md:rounded-2xl overflow-hidden border border-gray-800/80 relative">
        
        <!-- SOL TARAF: Sohbet ve Kişi Listesi -->
        <div id="sidebar" class="w-full md:w-[38%] bg-[#111b21] border-r border-gray-800 flex flex-col h-full absolute md:relative inset-y-0 left-0 z-20 transition-transform duration-300">
            <div class="bg-[#202c33] px-4 py-3 flex justify-between items-center border-b border-gray-800 flex-shrink-0">
                <div class="flex items-center space-x-3">
                    <div id="user-profile-container" class="cursor-pointer">
                        <div class="w-10 h-10 bg-gradient-to-tr from-cyan-600 to-emerald-500 rounded-full flex items-center text-white font-semibold shadow justify-center">AC</div>
                    </div>
                    <span id="user-name-span" class="text-gray-100 font-semibold tracking-wide text-sm">AuraChat</span>
                </div>
                <div class="flex space-x-4 text-gray-400 text-lg">
                    <i class="fa-solid fa-circle-notch cursor-pointer hover:text-white transition"></i>
                    <i class="fa-solid fa-comment-alt cursor-pointer hover:text-white transition"></i>
                    <i class="fa-solid fa-ellipsis-vertical cursor-pointer hover:text-white transition" id="logout-btn" title="Çıkış Yap"></i>
                </div>
            </div>

            <!-- Arama Kutusu -->
            <div class="p-2.5 bg-[#111b21] flex-shrink-0">
                <div class="bg-[#202c33] flex items-center px-3 py-2 rounded-xl border border-transparent focus-within:border-emerald-500/50 transition">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm mr-3"></i>
                    <textarea id="search-contact" rows="1" name="search_contact_field" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-form-type="other" placeholder="Kişilerde veya odalarda ara..." class="bg-transparent w-full text-sm text-white focus:outline-none placeholder-gray-400 resize-none overflow-hidden leading-tight" style="height:22px; max-height:22px;" oninput="this.value = this.value.replace(/\n/g, '');"></textarea>
                </div>
            </div>

            <!-- Liste -->
            <div id="contact-list" class="flex-1 overflow-y-auto divide-y divide-gray-800/40"></div>

            <div class="bg-[#202c33] border-t border-gray-800 py-2.5 px-6 flex justify-between items-center text-gray-400 flex-shrink-0">
                <div class="flex flex-col items-center cursor-pointer text-emerald-500 transition">
                    <i class="fa-solid fa-comment-dots text-lg"></i>
                    <span class="text-[10px] mt-0.5 font-medium">Sohbetler</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer hover:text-white transition">
                    <i class="fa-solid fa-circle-notch text-lg"></i>
                    <span class="text-[10px] mt-0.5">Durum</span>
                </div>
                <div class="flex flex-col items-center cursor-pointer hover:text-white transition">
                    <i class="fa-solid fa-users text-lg"></i>
                    <span class="text-[10px] mt-0.5">Kişiler</span>
                </div>
            </div>
        </div>

        <!-- SAĞ TARAF: Aktif Mesajlaşma Ekranı -->
        <div id="chat-area" class="w-full md:flex-1 flex flex-col bg-[#0b141a] absolute md:relative inset-y-0 right-0 z-30 translate-x-full md:translate-x-0 transition-transform duration-300 h-full overflow-hidden">
            <!-- Sohbet Üst Barı -->
            <div class="bg-[#202c33] px-4 py-3 flex justify-between items-center border-b border-gray-800 flex-shrink-0 z-10">
                <div class="flex items-center space-x-3">
                    <button id="back-btn" class="md:hidden text-gray-400 mr-1 hover:text-white transition text-lg px-1 py-0.5">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div id="active-chat-avatar" class="w-10 h-10 bg-gradient-to-tr from-emerald-600 to-cyan-600 rounded-full flex items-center text-white font-bold justify-center shadow flex-shrink-0">
                        <i class="fa-solid fa-globe text-sm"></i>
                    </div>
                    <div>
                        <h4 id="active-chat-name" class="text-white font-medium text-sm md:text-base">Genel Kanka Odası 🌍</h4>
                        <span id="active-chat-status" class="text-[11px] text-emerald-400 font-medium"></span>
                    </div>
                </div>
                <div class="flex space-x-5 text-gray-400 text-lg">
                    <i class="fa-solid fa-video cursor-pointer hover:text-white transition"></i>
                    <i class="fa-solid fa-paperclip cursor-pointer hover:text-white transition"></i>
                    <i class="fa-solid fa-ellipsis-vertical cursor-pointer hover:text-white transition"></i>
                </div>
            </div>

            <!-- Mesajların Akış Alanı -->
            <div id="message-container" class="flex-1 min-h-0 p-4 md:p-6 pb-10 overflow-y-auto space-y-4 bg-[url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')] bg-repeat opacity-95"></div>

            <!-- Mesaj Yazma Paneli -->
            <div class="bg-[#202c33] px-3 md:px-4 py-3 flex items-center space-x-3 border-t border-gray-800 flex-shrink-0 z-10 relative">
                <i class="fa-regular fa-face-smile text-gray-400 text-xl cursor-pointer hover:text-white transition"></i>
                <i class="fa-solid fa-plus text-gray-400 text-xl cursor-pointer hover:text-white transition"></i>
                
                <textarea id="message-input" name="aura_chat_msg_input_no_autofill" rows="1" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="true" data-lpignore="true" data-form-type="other" placeholder="Bir mesaj yazın..." class="bg-[#2a3942] text-white px-4 py-2.5 rounded-xl flex-1 text-sm focus:outline-none placeholder-gray-400 border border-transparent focus:border-emerald-500/50 transition resize-none overflow-hidden leading-tight" style="height:42px; max-height:42px;" oninput="this.value = this.value.replace(/\n/g, '');"></textarea>
                
                <button id="send-btn" class="bg-emerald-600 text-white w-10 h-10 rounded-xl flex items-center justify-center hover:bg-emerald-500 transition shadow flex-shrink-0">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- GİRİŞ MODÜLÜ -->
    <script type="module" src="js/giris.js"></script>

    <!-- FIREBASE VE UYGULAMA MANTIĞI -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTOmajjZsfnikrJLM1UVmXMlUobFNyJGs",
            authDomain: "aurachat-99f69.firebaseapp.com",
            projectId: "aurachat-99f69",
            storageBucket: "aurachat-99f69.firebasestorage.app",
            messagingSenderId: "447747395966",
            appId: "1:447747395966:web:7db71f9f912a188d17632f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const messageContainer = document.getElementById('message-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const userProfileContainer = document.getElementById('user-profile-container');
        const userNameSpan = document.getElementById('user-name-span');
        const contactList = document.getElementById('contact-list');
        const sidebar = document.getElementById('sidebar');
        const chatArea = document.getElementById('chat-area');
        const backBtn = document.getElementById('back-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const activeChatName = document.getElementById('active-chat-name');
        const activeChatAvatar = document.getElementById('active-chat-avatar');
        const activeChatStatus = document.getElementById('active-chat-status');
        const searchContact = document.getElementById('search-contact');

        let currentUser = JSON.parse(localStorage.getItem('aurachat_user'));
        let currentChatId = null;
        let currentChatName = '';
        let unsubscribeMessages = null;
        let unsubscribeChatDoc = null;
        let typingTimeout = null;
        
        const contactElementsMap = new Map();

        function renderSkeletonList() {
            let skeletonHtml = '';
            for (let i = 0; i < 5; i++) {
                skeletonHtml += `
                    <div class="flex items-center px-4 py-3 animate-pulse border-b border-gray-800/30">
                        <div class="w-12 h-12 bg-gray-700/50 rounded-full mr-3 flex-shrink-0"></div>
                        <div class="flex-1">
                            <div class="h-3.5 bg-gray-700/60 rounded w-1/3 mb-2"></div>
                            <div class="h-2.5 bg-gray-800/80 rounded w-2/3"></div>
                        </div>
                    </div>
                `;
            }
            contactList.innerHTML = skeletonHtml;
        }

        function formatTimestamp(dateObj) {
            if (!dateObj) return '';
            const now = new Date();
            const date = new Date(dateObj);

            const isToday = now.toDateString() === date.toDateString();

            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            const isYesterday = yesterday.toDateString() === date.toDateString();

            if (isToday) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (isYesterday) {
                return 'Dün';
            } else {
                const day = String(date.getDate()).padStart(2, '0');
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = date.getFullYear();
                return `${day}.${month}.${year}`;
            }
        }

        window.initApp = function() {
            currentUser = JSON.parse(localStorage.getItem('aurachat_user'));
            if (!currentUser) return;

            updateUserInterface(currentUser);
            renderSkeletonList();
            loadContacts();
            
            if (window.innerWidth >= 768) {
                selectChat('global', 'Genel Kanka Odası 🌍', 'global');
            } else {
                sidebar.classList.remove('-translate-x-full');
                chatArea.classList.add('translate-x-full');
            }
        };

        if (currentUser) {
            window.initApp();
        }

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('aurachat_user');
            localStorage.removeItem('aurachat_contacts_cache');
            location.reload();
        });

        function updateUserInterface(user) {
            if (userProfileContainer) {
                if (user.avatar) {
                    userProfileContainer.innerHTML = `<img src="${user.avatar}" class="w-10 h-10 rounded-full object-cover shadow border border-emerald-500/50">`;
                } else {
                    const initials = user.name.substring(0, 2).toUpperCase();
                    userProfileContainer.innerHTML = `<div class="w-10 h-10 bg-gradient-to-tr from-cyan-600 to-emerald-500 rounded-full flex items-center justify-center text-white font-semibold shadow">${initials}</div>`;
                }
            }
            if (userNameSpan) userNameSpan.textContent = user.name;
        }

        async function loadContacts() {
            let localPhoneNumbers = new Set();

            try {
                const ContactsPlugin = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Contacts)
                    ? window.Capacitor.Plugins.Contacts
                    : null;

                if (ContactsPlugin) {
                    let perm = await ContactsPlugin.checkPermissions();
                    if (perm.contacts !== 'granted') {
                        perm = await ContactsPlugin.requestPermissions();
                    }
                    if (perm.contacts === 'granted') {
                        const result = await ContactsPlugin.getContacts({ projection: { phones: true } });
                        if (result && result.contacts) {
                            result.contacts.forEach(c => {
                                if (c.phones && Array.isArray(c.phones)) {
                                    c.phones.forEach(p => {
                                        if (p.number) {
                                            const clean = p.number.replace(/\D/g, '').slice(-10);
                                            if (clean.length === 10) {
                                                localPhoneNumbers.add(clean);
                                            }
                                        }
                                    });
                                }
                            });
                        }
                    }
                }
            } catch (err) {
                console.warn("Rehber okunurken bir durum oluştu:", err);
            }

            onSnapshot(collection(db, "users"), (snapshot) => {
                contactList.innerHTML = '';
                contactElementsMap.clear();

                // 1. Genel Oda (Her zaman üstte kalır)
                const globalDiv = document.createElement('div');
                globalDiv.className = "flex items-center px-4 py-3 bg-[#202c33]/40 hover:bg-[#202c33] cursor-pointer transition border-b border-gray-800/30";
                globalDiv.innerHTML = `
                    <div class="w-12 h-12 bg-gradient-to-tr from-emerald-600 to-cyan-600 rounded-full flex items-center text-white font-bold justify-center mr-3 shadow flex-shrink-0">
                        <i class="fa-solid fa-globe"></i>
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <div class="flex justify-between items-baseline">
                            <h4 class="text-white font-medium text-sm">Genel Kanka Odası 🌍</h4>
                            <span class="text-[11px] text-gray-400 global-time"></span>
                        </div>
                        <p class="text-xs text-gray-400 truncate mt-0.5 global-preview">Ortak sohbet alanı</p>
                    </div>
                `;
                globalDiv.addEventListener('click', () => {
                    selectChat('global', 'Genel Kanka Odası 🌍', 'global');
                });
                contactList.appendChild(globalDiv);

                const globalTimeSpan = globalDiv.querySelector('.global-time');
                const globalPreview = globalDiv.querySelector('.global-preview');
                
                onSnapshot(query(collection(db, "chats", "global", "messages"), orderBy("createdAt", "desc")), (msgSnap) => {
                    if (!msgSnap.empty) {
                        const lastMsg = msgSnap.docs[0].data();
                        globalPreview.textContent = lastMsg.text;
                        if (lastMsg.createdAt) {
                            globalTimeSpan.textContent = formatTimestamp(lastMsg.createdAt.toDate());
                        }
                    }
                });

                const myNameClean = currentUser ? currentUser.name.trim().toLowerCase() : '';
                const myPhoneClean = currentUser && currentUser.phone ? currentUser.phone.trim() : '';

                // 2. Özel Sohbetler (SADECE Rehberde Olanlar VEYA Aktif Mesaj Geçmişi Olanlar)
                snapshot.forEach((docSnap) => {
                    const user = docSnap.data();
                    if (!user || !user.name) return;

                    const targetNameClean = user.name.trim().toLowerCase();
                    const targetPhoneClean = user.phone ? user.phone.trim() : '';

                    // Kendini gösterme
                    if (targetNameClean === myNameClean) return;
                    if (myPhoneClean && targetPhoneClean === myPhoneClean) return;

                    const chatId = [currentUser.name, user.name].sort().join('_');
                    const isInContacts = targetPhoneClean && localPhoneNumbers.has(targetPhoneClean);

                    onSnapshot(query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "desc")), (msgSnapshot) => {
                        const hasMessages = !msgSnapshot.empty;

                        // WHATSAPP MANTIĞI: Rehberde kayıtlı değilse VE geçmiş mesaj yoksa listeye EKLEME
                        if (!isInContacts && !hasMessages) {
                            if (contactElementsMap.has(chatId)) {
                                const item = contactElementsMap.get(chatId);
                                if (item.element && item.element.parentNode) {
                                    item.element.parentNode.removeChild(item.element);
                                }
                                contactElementsMap.delete(chatId);
                            }
                            return;
                        }

                        // Eğer listede yoksa yeni olarak oluştur
                        if (!contactElementsMap.has(chatId)) {
                            const userDiv = document.createElement('div');
                            userDiv.className = "flex items-center px-4 py-3 hover:bg-[#202c33]/60 cursor-pointer transition border-b border-gray-800/30";
                            
                            let avatarContent = `<div class="w-12 h-12 bg-cyan-600 rounded-full flex items-center justify-center text-white font-bold shadow flex-shrink-0">${user.name.substring(0,2).toUpperCase()}</div>`;
                            if (user.avatar) {
                                avatarContent = `<img src="${user.avatar}" class="w-12 h-12 rounded-full object-cover shadow flex-shrink-0">`;
                            }

                            userDiv.innerHTML = `
                                ${avatarContent}
                                <div class="flex-1 overflow-hidden ml-3">
                                    <div class="flex justify-between items-baseline">
                                        <h4 class="text-white font-medium text-sm">${escapeHtml(user.name)}</h4>
                                        <span class="text-[11px] text-gray-400 time-span"></span>
                                    </div>
                                    <div class="flex justify-between items-center mt-0.5">
                                        <p class="text-xs text-gray-400 truncate msg-preview flex items-center">
                                            <span class="tick-container hidden mr-1 flex-shrink-0"></span>
                                            <span class="preview-text truncate">Henüz mesaj yok</span>
                                        </p>
                                        <div class="unread-badge hidden bg-emerald-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] text-center ml-2"></div>
                                    </div>
                                </div>
                            `;

                            userDiv.addEventListener('click', () => {
                                selectChat(chatId, user.name, user.avatar || '');
                            });

                            contactElementsMap.set(chatId, {
                                element: userDiv,
                                lastTimeObj: null
                            });

                            contactList.appendChild(userDiv);
                        }

                        // Mesaj ve görünüm güncelleme
                        const itemData = contactElementsMap.get(chatId);
                        if (!itemData) return;

                        const timeSpan = itemData.element.querySelector('.time-span');
                        const previewText = itemData.element.querySelector('.preview-text');
                        const tickContainer = itemData.element.querySelector('.tick-container');
                        const unreadBadge = itemData.element.querySelector('.unread-badge');

                        let lastText = "Henüz mesaj yok";
                        let lastTime = "";
                        let lastTimeObj = null;
                        let unreadCount = 0;
                        let isLastMsgMine = false;
                        let lastMsgRead = false;

                        if (hasMessages) {
                            const latestMsg = msgSnapshot.docs[0].data();
                            lastText = latestMsg.text;
                            isLastMsgMine = (latestMsg.senderName === currentUser.name);
                            lastMsgRead = latestMsg.read;
                            if (latestMsg.createdAt) {
                                lastTimeObj = latestMsg.createdAt.toDate();
                                lastTime = formatTimestamp(lastTimeObj);
                            }
                        }

                        msgSnapshot.forEach((mDoc) => {
                            const mData = mDoc.data();
                            if (mData.senderName !== currentUser.name && mData.read === false) {
                                unreadCount++;
                            }
                        });

                        previewText.textContent = lastText;
                        timeSpan.textContent = lastTime;

                        if (isLastMsgMine) {
                            const tickColor = lastMsgRead ? 'text-[#53bdeb]' : 'text-gray-400';
                            tickContainer.innerHTML = `<i class="fa-solid fa-check-double text-[10px] ${tickColor}"></i>`;
                            tickContainer.classList.remove('hidden');
                        } else {
                            tickContainer.classList.add('hidden');
                        }

                        if (unreadCount > 0) {
                            unreadBadge.textContent = unreadCount;
                            unreadBadge.classList.remove('hidden');
                        } else {
                            unreadBadge.classList.add('hidden');
                        }

                        itemData.lastTimeObj = lastTimeObj;
                        sortContactList();
                    });
                });
            });
        }

        function sortContactList() {
            const itemsArray = Array.from(contactElementsMap.values());
            itemsArray.sort((a, b) => {
                if (!a.lastTimeObj) return 1;
                if (!b.lastTimeObj) return -1;
                return b.lastTimeObj - a.lastTimeObj;
            });

            itemsArray.forEach(item => {
                contactList.appendChild(item.element);
            });
        }

        function selectChat(chatId, name, avatar) {
            currentChatId = chatId;
            currentChatName = name;
            activeChatName.textContent = name;

            if (chatId === 'global') {
                activeChatAvatar.innerHTML = `<i class="fa-solid fa-globe text-sm"></i>`;
                activeChatStatus.textContent = "Herkes çevrimiçi";
            } else {
                if (avatar && avatar.startsWith('data:image')) {
                    activeChatAvatar.innerHTML = `<img src="${avatar}" class="w-full h-full rounded-full object-cover">`;
                } else {
                    activeChatAvatar.innerHTML = `<span class="text-sm font-bold">${name.substring(0,2).toUpperCase()}</span>`;
                }
                listenToChatDoc(chatId);
            }

            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                chatArea.classList.remove('translate-x-full');
            }

            loadMessages(chatId);
        }

        function listenToChatDoc(chatId) {
            if (unsubscribeChatDoc) unsubscribeChatDoc();
            activeChatStatus.textContent = "";

            unsubscribeChatDoc = onSnapshot(doc(db, "chats", chatId), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const otherName = chatId.split('_').find(n => n !== currentUser.name);
                    const isOtherTyping = otherName && data[`typing_${otherName}`];
                    
                    if (isOtherTyping) {
                        activeChatStatus.innerHTML = `<span class="text-emerald-400 font-medium animate-pulse">yazıyor...</span>`;
                    } else {
                        activeChatStatus.textContent = "";
                    }
                }
            });
        }

        backBtn.addEventListener('click', () => {
            if (unsubscribeMessages) {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }
            if (unsubscribeChatDoc) {
                unsubscribeChatDoc();
                unsubscribeChatDoc = null;
            }

            currentChatId = null;
            currentChatName = '';
            messageContainer.innerHTML = '';

            if (window.innerWidth < 768) {
                sidebar.classList.remove('-translate-x-full');
                chatArea.classList.add('translate-x-full');
            }
        });

        function loadMessages(chatId) {
            if (unsubscribeMessages) unsubscribeMessages();

            const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                messageContainer.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    
                    if (currentChatId === chatId && chatId !== 'global' && msg.senderName !== currentUser.name && msg.read === false) {
                        updateDoc(doc(db, "chats", chatId, "messages", docSnap.id), {
                            read: true
                        });
                    }

                    renderMessage(msg);
                });
                scrollToBottom();
            }, (error) => {
                console.error("Mesajlar yüklenirken hata:", error);
            });
        }

        function scrollToBottom() {
            setTimeout(() => {
                messageContainer.scrollTop = messageContainer.scrollHeight;
            }, 50);
        }

        function renderMessage(msg) {
            const isMe = currentUser && msg.senderName === currentUser.name;
            const msgDiv = document.createElement('div');
            const timeStr = msg.createdAt ? new Date(msg.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Şimdi';

            if (isMe) {
                const tickColor = msg.read ? 'text-[#53bdeb]' : 'text-gray-400';
                msgDiv.className = "flex justify-end";
                msgDiv.innerHTML = `
                    <div class="bg-[#005c4b] text-white px-4 py-2 rounded-xl max-w-[80%] md:max-w-md text-sm shadow relative">
                        <p class="break-words">${escapeHtml(msg.text)}</p>
                        <div class="flex items-center justify-end space-x-1 mt-1">
                            <span class="text-[10px] text-emerald-200">${timeStr}</span>
                            <i class="fa-solid fa-check-double text-[10px] ${tickColor}"></i>
                        </div>
                    </div>
                `;
            } else {
                msgDiv.className = "flex justify-start";
                msgDiv.innerHTML = `
                    <div class="bg-[#202c33] text-gray-100 px-4 py-2 rounded-xl max-w-[80%] md:max-w-md text-sm shadow relative">
                        <p class="break-words">${escapeHtml(msg.text)}</p>
                        <span class="text-[10px] text-gray-400 float-right ml-3 mt-1">${timeStr}</span>
                    </div>
                `;
            }
            messageContainer.appendChild(msgDiv);
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentUser || !currentChatId) return;

            try {
                if (currentChatId !== 'global') {
                    await setDoc(doc(db, "chats", currentChatId), {
                        [`typing_${currentUser.name}`]: false
                    }, { merge: true });
                }

                messageInput.value = '';

                await addDoc(collection(db, "chats", currentChatId, "messages"), {
                    text: text,
                    senderName: currentUser.name,
                    senderAvatar: currentUser.avatar || '',
                    createdAt: serverTimestamp(),
                    read: false
                });

                scrollToBottom();
            } catch (e) {
                console.error("Mesaj gönderilemedi: ", e);
                alert("Mesaj gönderilirken hata oluştu!");
            }
        }

        messageInput.addEventListener('input', () => {
            if (!currentChatId || currentChatId === 'global') return;

            setDoc(doc(db, "chats", currentChatId), {
                [`typing_${currentUser.name}`]: true
            }, { merge: true });

            if (typingTimeout) clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                if (currentChatId && currentChatId !== 'global') {
                    setDoc(doc(db, "chats", currentChatId), {
                        [`typing_${currentUser.name}`]: false
                    }, { merge: true });
                }
            }, 2000);
        });

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        searchContact.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const items = contactList.children;
            for (let item of items) {
                const text = item.textContent.toLowerCase();
                if (text.includes(term)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>

<script>
    function syncViewport() {
        if (!window.visualViewport) return;
        document.body.style.height = window.visualViewport.height + 'px';
        document.body.style.top = window.visualViewport.offsetTop + 'px';
        window.scrollTo(0, 0);
        
        const messageContainer = document.getElementById('message-container');
        if (messageContainer) {
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }
    }
    
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewport);
        window.visualViewport.addEventListener('scroll', syncViewport);
    }
    syncViewport();
</script>

<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker kaydedildi 👍', reg.scope))
          .catch(err => console.log('Service Worker hatası ❌', err));
      });
    }
</script>

</body>
</html>
